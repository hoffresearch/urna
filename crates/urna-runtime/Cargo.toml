[package]
name = "urna-runtime"
description = "mmap runtime of the urna vector database: simd exact search, hnsw, bm25, graph and hybrid search with mandatory exact rerank"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["database-implementations", "algorithms"]

[dependencies]
urna-format = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
half = { workspace = true }
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[lib]
name = "urna_runtime"
path = "src/lib.rs"

# criterion benches: `cargo bench -p urna-runtime`.
# default features off: no rayon, no plotters html report, just the
# statistics and the cli.
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "simd"
harness = false

[[bench]]
name = "rerank"
harness = false

[[bench]]
name = "hnsw_build"
harness = false
