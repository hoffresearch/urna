[package]
name = "urna-cli"
description = "sovereign embedded vector database: single-file .urna container with content-addressable citations, offline-first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "database-implementations"]

[lints]
workspace = true

[[bin]]
name = "urna"
path = "src/main.rs"

# cargo-binstall: `cargo binstall urna-cli` fetches the prebuilt binary from
# the github release instead of compiling (issue #75). names match the
# cargo-dist archive layout; windows ships a .zip, everything else .tar.xz.
[package.metadata.binstall]
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# channel names: npm `@urna/cli` (under the workspace `npm-scope`) and the
# homebrew formula `urna` (`brew install hoffresearch/urna/urna`); the binary
# is `urna` in both.
[package.metadata.dist]
npm-package = "cli"
formula = "urna"

[dependencies]
urna-format = { workspace = true }
urna-runtime = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memmap2 = { workspace = true }
rand = "0.10"
hex = "0.4"
sha2 = { workspace = true }
