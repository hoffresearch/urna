# forge-core is a SEPARATE cargo workspace, deliberately OUTSIDE the
# sovereign crates/ workspace, so the (eventually heavy, possibly
# non-deterministic) forge ingestion deps -- pdf, ocr, clip, fonttools --
# never enter urna-format / urna-runtime. this crate is FORGE-0a: the
# frozen .fci schema only. build/test it from this directory:
#   cargo build --manifest-path forge-core/Cargo.toml
#   cargo test  --manifest-path forge-core/Cargo.toml
[package]
name = "forge-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "forge canonical intermediate (.fci) schema, outside the sovereign urna workspace"
repository = "https://github.com/hoffresearch/urna"
# internal ingestion layer, not a crates.io package (the name is taken there).
publish = false

[workspace]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
