[package]
name = "pasta-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

# its own workspace: a demo app on top of urna-engine, outside the urna
# workspace build and tests.
[workspace]

[dependencies]
urna-engine = { path = "../../rust/engine" }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["avif-native"], optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
ratatui-image = { version = "=12.0.0-rc.2", default-features = false, features = ["crossterm", "chafa-dyn"], optional = true }

[features]
default = []
# decode the stored AVIF into pixels in process (desktop, TUI); the apps can
# take the AVIF bytes and let the platform decode them instead.
decode = ["dep:image"]
tui = ["decode", "dep:ratatui", "dep:crossterm", "dep:ratatui-image"]

[[bin]]
name = "pasta-tui"
required-features = ["tui"]

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
urna-format = { path = "../../rust/format" }
memmap2 = "0.9"
