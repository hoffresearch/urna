[diagram]
format = "mermaid"
kind = "sequenceDiagram"
description = "visual architecture map: the build and query flows across the rust/python language boundary. the .urna file is the only artifact that crosses it. renders on github inside a ```mermaid fenced block; extract the `source` string verbatim to feed mermaid-cli or any mermaid live editor."
source = '''%% urna visual architecture reference
%% the diagram.source field of docs/arc/arc.toml (the single architecture
%% reference: narrative, contract, inventory, and this diagram, merged
%% 2026-09-18 from the former arc.yaml + arc.mmd + arc.schema.json). there
%% is no separate human-prose architecture doc.
%%
%% design note:
%%   this is a sequenceDiagram, not a flowchart with subgraphs. structured
%%   diagram types lay out deterministically and render cleanly on github;
%%   subgraph flowcharts with cross-cluster edges do not. the file inventory
%%   in this same arc.toml (the `inventory` table) is the authoritative
%%   module breakdown.
%%
%%   it traces the two flows that define urna: build (python writes the file)
%%   and query (rust serves from the file). the .urna file is the only
%%   artifact that crosses the language boundary.

sequenceDiagram
    autonumber
    participant B as builder.py
    participant F as urna-format
    participant N as .urna file
    participant R as urna-runtime
    participant E as embed_query.py
    participant Q as urna cli / api
    participant P as embed_query_potion.py
    participant A as ask / retrieve
    participant I as image corpus tooling
    participant D as urna_forge.py (spec)
    participant U as urna_ui_bridge.py (json)

    note over B,N: build · offline · reproducible
    B->>B: chunk + embed + model_hash
    B->>F: urna.build(chunks, model_hash, mrl_dim?, with_graph?)
    F->>F: optional matryoshka truncate + renorm, then quant
    F->>F: per-section try-smaller wire encoding (text: zstd / txt_streams / dict / fsst / dedup; content_hash-stable)
    F->>F: optional graph_adjacency 0x0C csr (NEXT_CHUNK + top-m semantic; excluded from content_hash)
    F->>N: deterministic emit + four hashes

    note over I,N: image corpus build · offline · media inside the .urna
    I->>I: discover images / render pdf pages (sorted, ordinal = frame no)
    I->>I: letterbox onto one canvas
    I->>I: probe_gop sonda (gop_policy=auto decides intra vs inter)
    I->>I: optional similarity_order + sharding, then encode av1/avif via pipe
    I->>I: verify frame count == item count
    I->>I: vision embed the DECODED frames (dermlip / clip)
    I->>F: urna.build(chunks, blob_refs, chunk_blob_spans, spaces=[image space], model_hash)
    F->>F: optional blob_refs 0x14 + span overlay 0x16 + inlined blob_data 0x17 (embed_media) + space_table 0x15 + band slab 0x20+ (all excluded from content_hash)
    F->>N: deterministic emit + four hashes (media travels inside the file)

    note over D,N: declarative build · one toml, many models · transactional
    D->>D: load spec (typed SpecError; order_by must be a total order)
    D->>D: load rows + per-item input_hash; dedup identical images
    D->>I: media via backends (crf=auto gate: ssimulacra2 strata + embedding drift + optional text-to-image hit@1 utility leg; tune/jxl levers)
    D->>D: embed each registry model once (triad-addressed cache under xdg, shared across specs; st models in isolated workers)
    D->>F: urna.build per output (single / per-model / both; space 0 = the ONE default text model)
    F->>N: deterministic emit + manifest v1 + build.lock.json

    note over R,Q: query · offline · mmap
    Q->>E: search-text spawns embedder
    E-->>Q: query vector + model_hash
    Q->>R: search(vector) / search_space(vector, space)
    R->>N: mmap open + validate hashes
    R->>R: model_hash vs manifest (per space, in isolation)
    R->>R: hnsw / bm25 / graph-bfs candidates
    R->>R: mandatory exact cosine rerank
    R-->>Q: hits + urna://content_hash/chunk_id

    note over A,N: flagship · agent-native · offline by construction
    A->>P: ask / retrieve embed query OFFLINE (embed_gate routes by manifest model: potion table, or embed_query_model.py for registry models)
    P-->>A: query vector + model_hash
    A->>R: route by manifest capability, search (score IS the exact rerank)
    R-->>A: hits + SearchExplain (rerank_source: real cosine vs stored precision)
    A->>N: decode tier-1 stored canonical text per chunk_id
    A-->>Q: cited answer (ask) / json-jsonl answer-pack (retrieve) + urna:// citation

    note over U,N: json bridge · any frontend, zero engine logic outside the engine
    U->>U: embed query via registry preset (URNA_ALLOW_REMOTE_CODE opt-in)
    U->>R: browse / search exact·ann·hybrid·graph·space / blob_bytes(i), all via _urna
    R-->>U: hits matched by chunk_id + media resolved to blob uri + shard-local frame (segments↔blobs by sha256) + single-blob bytes
'''

[schema]
note = "documents the shape this file follows. previously enforced only as an editor hint (arc.schema.json bound via a `# yaml-language-server: $schema=` modeline). toml has no equivalent standardized ide-schema binding, so this section is documentation, not machine-validated."
required_top_level = ["project", "last-updated", "domain", "summary", "system_view", "contract", "quality", "risks", "layers", "flows", "inventory", "diagram"]

[[schema.fields]]
field = "project"
type = "string"
notes = "const \"urna\""

[[schema.fields]]
field = "last-updated"
type = "string"
notes = "pattern ^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

[[schema.fields]]
field = "domain"
type = "string"

[[schema.fields]]
field = "summary"
type = "string"
notes = "minLength 1, a running dated changelog in one paragraph"

[[schema.fields]]
field = "system_view[] / contract[] / quality[] / risks[]"
type = "array<string>"
notes = "minItems 1, each item minLength 1"

[[schema.fields]]
field = "layers[].name"
type = "string"
notes = "minLength 1"

[[schema.fields]]
field = "layers[].role"
type = "string"
notes = "minLength 1"

[[schema.fields]]
field = "layers[].entrypoints"
type = "array<string>"
notes = "repo-relative paths"

[[schema.fields]]
field = "layers[].links"
type = "array<string>"
notes = "repo-relative paths"

[[schema.fields]]
field = "flows[].name"
type = "string"
notes = "minLength 1"

[[schema.fields]]
field = "flows[].entry"
type = "string"
notes = "minLength 1"

[[schema.fields]]
field = "flows[].path"
type = "array<string>"
notes = "repo-relative paths"

[[schema.fields]]
field = "flows[].summary"
type = "string"
notes = "minLength 1"

[[schema.fields]]
field = "inventory.<group>[].path"
type = "string"
notes = "repo-relative, no leading ./"

[[schema.fields]]
field = "inventory.<group>[].kind"
type = "string"
notes = "pattern ^[a-z0-9]+(-[a-z0-9]+)*$ (kebab-case category)"

[[schema.fields]]
field = "inventory.<group>[].purpose"
type = "string"
notes = "minLength 1"

[[schema.fields]]
field = "inventory.<group>[].links"
type = "array<string>"
notes = "repo-relative paths"

[[schema.fields]]
field = "diagram.format"
type = "string"
notes = "always \"mermaid\""

[[schema.fields]]
field = "diagram.kind"
type = "string"
notes = "mermaid diagram type, e.g. sequenceDiagram"

[[schema.fields]]
field = "diagram.source"
type = "string"
notes = "raw mermaid source, literal multiline, byte-identical to the former arc.mmd body"
