    "scripts/ruff_check.sh",
    "forge-core/Cargo.toml",
]
summary = "on every push and pull request: fmt, clippy with the workspace deny lints, build + test on ubuntu (avx2) and macos (neon), the mutation-fuzz harnesses at a higher iteration count, the 300-line guard, forge-core's gate, ruff over the shared file list, and a bounded cargo-fuzz smoke on nightly"

[[flows]]
name = "mutation-fuzz"
entry = "crates/urna-format/tests/mutation_fuzz.rs"
path = [
    "crates/urna-format/tests/common/mutation.rs",
    "crates/urna-format/src/reader/parse.rs",
    "crates/urna-format/src/reader/decode.rs",
    "crates/urna-runtime/tests/mutation_fuzz.rs",
    "crates/urna-runtime/src/mmap_file.rs",
    "fuzz/fuzz_targets/urna_view.rs",
]
summary = "build real files in every dtype / text-encoding combination with every optional section present, mutate them (bit flips, byte sets, zero runs, integer specials, truncation, splices; half with checksums resealed so the corruption reaches the decoders), and drive the reader, every section decoder, the mmap open path and every search verb: a typed error is fine, a panic is a finding that becomes a tests/negative_*.rs"

[[flows]]
name = "competitor-bench"
entry = "python/tools/bench_competitors.py"
path = [
    "python/tools/_bench_systems.py",
    "python/urna.py",
    "docs/benchmarks.md",
]
summary = "same synthetic rows, same queries, same machine: urna exact / hybrid against usearch, hnswlib, sqlite-vec and lancedb on build time, bytes on disk, cold open + first query, warm p50/p99, recall@10 vs brute force, byte-identical rebuild, integrity check, citation stability across text re-encoding; every hnsw path at m=16 / ef_c=200 / ef=100"

