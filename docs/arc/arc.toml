name = "ci"
entry = ".github/workflows/ci.yml"
path = [
    "Cargo.toml",
    "clippy.toml",
    "crates/urna-format/tests/mutation_fuzz.rs",
    "crates/urna-runtime/tests/mutation_fuzz.rs",
