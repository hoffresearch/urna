# urna architecture reference: single consolidated file.
# merged 2026-09-18 from the former docs/arc/arc.yaml (machine + human
# reference), docs/arc/arc.mmd (mermaid visual map), and docs/arc/arc.schema.json
# (the arc.yaml ide-validation schema). doc-location change only; no
# architecture, format, or runtime change. there is no separate
# human-prose architecture doc: this file is it.

project = "urna"
last-updated = "2026-09-26"
domain = "architecture"
summary = "single-file semantic knowledge stack: rust owns format, runtime, cli, and bindings; python owns ingestion, model fingerprinting, and support tooling. p1#07 (G1) added the optional chunk-to-chunk graph_adjacency (0x0C) csr + search-graph. p1#08 stood up the agent-native flagship over the EXISTING engine: cli `ask`/`retrieve` + python UrnaFile.retrieve (offline potion embed, model_hash gate, capability route, tier-1 cited spans whose score IS the exact rerank value) + the additive SearchExplain honesty backbone (rerank_source: real cosine vs real cosine at stored precision). 2026-08-10: the media blob pillar (F4b) brought codec-backed media INTO the container (blob_refs 0x14 + blob_span_overlay 0x16, capabilities_ext.blobs_present) and the multimodal space pillar (F4c) added the space_table 0x15 registry plus per-space embedding slabs in the 0x20-0x2F band behind capabilities_ext.supports_multimodal, each space gated by its own model_hash in isolation; F5 added the build-time levers gop_policy=auto probe, sharding, similarity ordering, and the dtype ladder for image corpora. all additive, content_hash-excluded, zero format bytes changed for text corpora, no URNA_FORMAT_VERSION bump; verb-collapse / urna dev / urna-profile deferred. 2026-08-11: the distribution surface (issue #75) landed: cargo-dist cli releases (5 targets, sha256, sigstore attestations, homebrew tap), the maturin `urna` wheel with the bundled potion table (abi3 cp312, OIDC trusted publishing), one-liner installers, `urna doctor` with typed exit codes, the minimal docker image, and offline integration examples. 2026-08-31: declarative builds + model registry + compression levers (rfcs 0-5, no format change): `urna build --spec corpus.toml` launches python/tools/urna_forge.py -> forge/build_spec.py (toml contract, SpecError names the key, total-order enforcement) -> forge/corpus_sources.py (sqlite/csv/jsonl/image_dir rows with per-item input_hash) -> forge/forge_pipeline.py (transactional stages, dedup via shared 0x16 spans, triad-keyed embed caches model_hash+recipe_hash+input_hash, single/per-model/both outputs from one embed pass, manifest_schema_version=1 + build.lock.json); forge/model_registry.py holds the model presets (potion/clip-vit-b32/siglip2/jina-v5-omni/wemm-2b|4b|9b/fake-test) with validated mrl ladders, remote-code opt-in + pinned hash allowlist, and subprocess-isolated st adapters (one worker per model via forge/embed_st_worker.py -- two trust_remote_code ST models in one process collide in transformers dynamic modules, measured); forge/quality_gate.py is the dual crf=auto gate (stratified ssimulacra2 floors + embedding-drift floor); jxl/jxl-transcode backends are the lossless modes (round-trip verified); cli grew search-space, build, stats/inspect spaces, benchmark --space, and cmd/embed_gate.rs (the ONE copy of the three-layer model gate, routing ask/retrieve by manifest model through forge/embed_query_model.py); python/tools/urna_model_bench.py compares models in three never-aggregated tiers. 2026-09-03: single-asset access + frontend bridge (no format change): UrnaFile.chunk_ids() (chunk identity in file order) and UrnaFile.blob_bytes(i) (one inlined 0x17 blob without exporting the store) landed in urna-python; python/tools/urna_ui_bridge.py is the json bridge any frontend drives a corpus through (browse with media resolved to blob uri + shard-local frame via sha256 segment matching, search in every mode with hits matched by chunk_id, single-blob extraction); the bench now matches by chunk_id (ordinal==offset only held for single-shard unordered video; cluster and per-image corpora silently zeroed) and expands ${ENV} placeholders in redacted manifest paths. measured full-corpus: retrieval-only av1 crf50 = 7.8x with hit@k parity against the lossless twin while the drift floor would have vetoed it (drift is stability, not utility; a hit@k gate floor is the registered follow-up, landed 2026-09-12 as the utility leg); avif q48 = the crf35 still class's drift at -20% bytes; the av1/avif twins share one content_hash across a backend swap. 2026-09-05: hardening pass driven by an external review: workspace deny lints unwrap_used + undocumented_unsafe_blocks, urna_format::bytes typed field readers, bytemuck views replacing the layout/int8 raw-parts casts (urna-format has zero unsafe), release-kept asserts at the simd safe/unsafe boundary, allocation-free int4 rerank (caller scratch), deterministic mutation-fuzz harnesses in both crates + four cargo-fuzz targets under fuzz/ (first runs found and fixed four malformed-file panic classes: unchecked n*dim, NaN reaching a partial_cmp sort, wrapping cursor bounds checks, unvalidated bm25 postings), .github/workflows/ci.yml (the first workflow to run cargo test on a pull request), the cli regrouped into engine verbs (cmd/*) and agent verbs (cmd/agent/*), and docs/benchmarks.md measured against usearch / hnswlib / sqlite-vec / lancedb. 2026-09-18: docs/arc consolidated into a single docs/arc/arc.toml (previously the arc.yaml + arc.mmd pair plus the arc.schema.json IDE-validation schema); doc-location change only, no architecture, format, or runtime change. 2026-09-22: `doc/` renamed to `docs/` and `dat/` to `data/` (paths only); examples/quickstart/ added (jsonl + potion spec + python twin, the five-verb loop from a clean checkout). 2026-09-26: the release feeds two more channels, configured and not yet published: crates.io (urna-format, urna-runtime, urna-cli in dependency order via the custom cargo-dist publish job .github/workflows/publish-crates.yml; urna-python and forge-core publish = false) and npm (`@urna/cli`, the cargo-dist npm installer fetching the release archive); the homebrew formula is named `urna`."

system_view = [
    "urna-format is the frozen v1 container contract. it owns layout, manifest, reader, writer, canonical sections, hashes, and wire encodings. embeddings stay raw float32, float16, int8, or int4 (fixed-stride quant only); zstd is reserved for non-embedding sections.",
    "urna-runtime opens .urna files through mmap, validates queries, dispatches simd, and executes exact, ann, graph, and hybrid search while reranking candidates with real cosine. that hot path is why embeddings are never zstd-compressed.",
    "urna-cli is a thin clap surface over the runtime and format crates. it carries the twelve engine subcommands (inspect, validate, stats, media, search, search-text, search-ann, search-graph, search-space, benchmark, cite, doctor: file + vector in, never run python) and the three agent verbs (ask, retrieve, build: text or spec in, shell out to the offline python embedder / forge), tagged [engine] / [agent] in --help. ask and retrieve are the agent-native flagship verbs layered over the engine (text query in, cited answer out; both embed the query offline with the default potion static table, validate the embedder's model_hash against the manifest exactly like search-text, and route by manifest capability; ask prints one cited answer (--disclose answer) or adds the rerank-source honesty line + route + candidate counts (--disclose explain); retrieve emits the agent-shaped json/jsonl answer-pack where each hit's score IS the exact-cosine rerank value). doctor is the post-install health check with typed exit codes (0 ok, 2 python missing, 3 deps missing, 4 embedder missing, 5 potion table missing, 6 embedder run failed). verb-collapse, the urna dev namespace, and the urna-profile crate are deferred.",
    "the distribution layer (issue #75) turns tags on main into installs: cargo-dist builds the cli for five targets with sha256 checksums, sigstore keyless attestations, a homebrew tap formula (`urna`) and an npm package (`@urna/cli`), and publishes urna-format / urna-runtime / urna-cli to crates.io; maturin builds the `urna` abi3 wheel with the potion table bundled (offline embedding after pip install); scripts/install.sh / install.ps1 are the one-liner installers (verify-before-write, --version, --uninstall); urna doctor validates the install offline; .github/workflows/install-test.yml tests the INSTALLED product per platform after each release.",
    "urna-python is the pyo3 bridge. python/urna.py loads the compiled extension, python/builder.py orchestrates chunking and caching, and python/embed_query.py preserves model parity for search-text. the agent-native flagship is UrnaFile.retrieve(query, k, ...): a pre-embedded query in, cited spans out, whose score IS the exact rerank value, with tier-1 stored canonical text + hashes + citation_id + rerank-source marker.",
    "scripts/release_check.sh is the release gate: rebuilds the extension, runs rust and python suites, checks lint and format, measures presets, and compares against the committed baseline.",
    "forge-core is the ingestion layer, a SEPARATE cargo workspace at the repo root OUTSIDE crates/, so its (eventually heavy, possibly non-deterministic) deps never enter urna-format or urna-runtime. this phase ships FORGE-0a: the frozen .fci canonical-intermediate schema only. it is not built by the sovereign release gate; it has its own cargo workspace.",
    "python/forge is the forge python surface. its build-side default is an offline semantic static embedder (python/forge/embed_potion.py): a vendored model2vec/potion-base-8M table (mit, dim 256, ~30mb via git-lfs), numpy + tokenizers only, no torch, no network round-trip; it self-fingerprints to a sha256 model_hash recorded in provenance. the #04 lexical bag-of-words (python/forge/embed_default.py) stays as the stdlib-only zero-dependency floor/fallback.",
    "the image corpus path is python-only and stays in the forge tooling layer, because a vision tower needs torch and the sovereign runtime does not take that dependency; no format or runtime code depends on it and the .urna it emits is an ordinary .urna. python/forge/image_items.py owns discovery (sorted, reproducible: an item's position IS its corpus ordinal, its frame number, and the byte_start its citation resolves through). python/forge/image_media.py, image_encode.py (+ image_encode_still.py for avif/jxl, image_gop_probe.py for the probe), and image_backends.py (+ image_backends_av1.py for the stream) own the codec path: images are letterboxed onto one canvas, frames move through a rawvideo pipe, the encoded frame count is verified against the item count, and gop_policy=auto probe-encodes both directions before choosing. every codec backend (av1, avif, jxl, jxl-transcode) records media.source_bytes as the byte size of the original source files, so compression_ratio is one quantity across them (the avif letterboxed png sum is kept apart as letterboxed_input_bytes; the png-lossless control reports output_bytes only, it is the ruler). python/forge/embed_image.py fingerprints the weights actually loaded plus the preprocess transform, and rejects a bare architecture name with no pretrained tag. a corpus is corpus.urna beside corpus.media/ plus corpus.manifest.json, or, since the media blob pillar, the media travels inside the .urna itself via blob_refs (0x14) + blob_span_overlay (0x16).",
]

contract = [
    "required sections are chunk_ids, chunks_canonical, chunks_original_spans, embeddings, provenance, and search_contract. optional sections are hnsw_index, bm25_index, graph_adjacency (0x0C, G1), blob_refs (0x14), space_table (0x15), blob_span_overlay (0x16), and blob_data (0x17).",
    "additive section ids past the implemented 0x01-0x08 are reserved in one reconciled, disjoint map in layout/mod.rs: 0x09-0x10 (scalar reservations: embeddings_fp, dictionary, dedup_map, graph_adjacency, chunk_scalars, tokenizer_model, edit_journal, repro_manifest), 0x11-0x17 (graph_nodes, graph_edge_props, graph_entity_map, blob_refs, space_table, blob_span_overlay, blob_data), and the per-space bands 0x20-0x2F (space embeddings) and 0x30-0x3F (space fp). all are excluded from content_hash and unresolved by section_name until their feature ships. graph_adjacency (0x0C), blob_refs (0x14), space_table (0x15), blob_span_overlay (0x16), and blob_data (0x17) are ACTIVE: they join OPTIONAL_SECTIONS behind the additive manifest capabilities graph_present, blobs_present, and supports_multimodal, stay OUT of CANONICAL_SECTIONS, and keep a media or multimodal corpus citation-identical to its text-only twin. tests/reserved_ids.rs asserts the bands stay disjoint and content_hash-safe.",
    "the graph pillar (G1) ships the chunk-to-chunk csr in SECTION_GRAPH_ADJACENCY (0x0C): intpack offsets, a per-(src,edge_type)-run delta-gapped neighbor-id blob, and an edge-type column (NEXT_CHUNK=0, SEMANTIC=1, CITATION=2), canonically sorted so two builds are byte-identical. runtime graph::CsrIndex parses it off mmap into flat offsets+neighbors; graph::Traversal::bounded_bfs walks it with a generational visited buffer. search_graph seeds the exact-cosine top-ef, bounded-bfs-expands the union, then feeds it to the same score_subset exact rerank; falls back to exact when no 0x0C section is present.",
    "the media blob pillar ships the self-contained single-file layout in SECTION_BLOB_REFS (0x14) and SECTION_BLOB_SPAN_OVERLAY (0x16), both typed-error on every truncation and hostile-count bounds before any allocation. blob_refs is a table of media records (uri, byte length, sha256, media kind); the overlay maps chunk ordinals to blob-relative spans and rewrites blob-pointing spans in place at open, so cite and retrieve report real blob-relative byte ranges instead of ordinal placeholders. SECTION_BLOB_DATA (0x17) completes it: an offset table PARALLEL to the 0x14 record order plus the raw inlined media bytes, opened lazily (the runtime slices one blob off the mmap, never copies the section), populated by [output] embed_media in the forge and served by `urna media <file> [--export DIR]` with per-blob sha256 verification in both export and `urna validate`. all three stay OUT of CANONICAL_SECTIONS, so adding or inlining blobs never moves a citation. frame extraction stays in the python tooling: decode needs the codec, and the sovereign runtime does not take that dependency.",
    "the multimodal space pillar ships SECTION_SPACE_TABLE (0x15) plus the per-space vector bands 0x20-0x2F (fp sources 0x30-0x3F) behind capabilities_ext.supports_multimodal. each space carries its own name, model_hash, dim, and dtype; bands follow the embeddings encoding rule (dtype encodings only, never zstd). runtime search_space(name, query, k, expected_model_hash) scores the band with the shared exact-cosine kernel off mmap; the text paths never read a band and the space path never reads 0x04, so a text query can never be scored against vision by accident.",
    "wire encodings reserve ids 4-10 (intpack, zstd_dict, frontcode, int4, rabitq, fsst, txt_streams); decode_payload dispatches through a context-free wire-codec registry. fsst (9), zstd_dict (5, via decode_payload_with_dict), int4 (7), intpack (4), and txt_streams (10) are implemented; frontcode (6) and rabitq (8) stay reserved-but-unimplemented and rejected.",
    "raw and zstd apply to non-embedding payloads, plus the content_hash-preserving repacks (intpack, txt_streams/zstd_dict/fsst). float16, int8, and int4 apply only to embeddings. embeddings never use zstd because the runtime scores them directly from mmap through the simd path, and are never dict/fsst/dedup-touched.",
    "matryoshka prefix truncation is a build-time dimension lever orthogonal to and multiplicative with value precision: urna.build(mrl_dim=K) slices each l2-normalized f32 row to its first K components and re-l2-normalizes on the prefix BEFORE quantization. the header/manifest embedding_dim becomes K and the source dim is recorded as full_dim; no runtime kernel change, since the reader strides exclusively by header.embedding_dim. int4 still needs the effective dim divisible by 64, so the multiplicative int4 ladder is valid only at mrl_dim in {256,192,128}.",
    "the four integrity surfaces are header_checksum, section checksum over physical bytes, file_hash over the whole pre-footer body, and content_hash over decoded canonical sections.",
    "the manifest is covered by file_hash, never content_hash. new manifest fields must be additive: Option with skip_serializing_if, so an unset field serializes to nothing. new capability flags go in the optional capabilities_ext or the flattened extra map, never as new required bools on Capabilities. tests/manifest_additivity.rs is the guard.",
    "exact search is always the ground truth path. hnsw and hybrid search return final hits only after exact cosine rerank.",
    "the mandatory exact rerank reads through one explicit rerank source (runtime/src/rerank.rs): the full-precision embeddings_fp (0x09) slab when present, else the stored dtype slab, so the returned score is always real cosine (at stored precision unless an fp source is present). every candidate-generating path (ann, hybrid, graph, space) ends in this source; runtime/tests/rerank_contract.rs asserts the returned score equals the exact rerank byte-for-byte and recall is NaN for every non-exact path.",
    "every SearchResult carries an additive SearchExplain (runtime/src/lib.rs): the route (exact/hnsw/graph/hybrid), the per-path candidate counts, the fusion_mode, the recall_estimate, and the load-bearing rerank_source (RerankSourceKind::FullPrecision = real cosine, vs StoredPrecision = real cosine at stored precision) so a sub-int8 corpus can never present a stored-precision score as full-precision.",
    "the optional embeddings_fp (0x09) section is a fixed-stride raw slab (float32 or float16, never zstd) read at open.",
    "citation ids use the form urna://content_hash/chunk_id, so references remain stable across raw versus zstd text encodings.",
]

quality = [
    "the format and runtime emphasize deterministic layout, typed errors, and checksum-verified reads.",
    "embeddings stay mmap-friendly on disk: raw float32, float16, int8, or int4 (fixed-stride quant) only; zstd is reserved for non-embedding sections so search can stay zero-copy and simd-driven.",
    "the cli stays intentionally thin and delegates behavior to runtime and format crates.",
    "the python surface is small and explicit: load extension, build corpora, fingerprint models, and run support tooling.",
    "ann, graph, hybrid, and space paths always rerank with exact cosine, which keeps scores consistent across search modes.",
    "a malformed .urna may be rejected with a typed error, never with a panic: clippy denies unwrap_used and undocumented_unsafe_blocks workspace-wide, urna-format carries zero unsafe (bytemuck views), fixed-width fields go through urna_format::bytes, header-derived sizes are overflow-checked, cursor bounds checks are written need > remaining, every scored slab (canonical, fp, bands) passes a finite-values gate at open, and every f32 sort is a NaN-last total order (urna_runtime::order). the mutation-fuzz harnesses run under cargo test and ci; fuzz/ holds the coverage-guided targets.",
    "media (blob_refs/blob_span_overlay) and multimodal spaces (space_table + bands) are additive and content_hash-excluded, so attaching them to a corpus never moves an existing text citation; each named space is gated by its own model_hash in isolation.",
]

risks = [
    "docs/arc/arc.toml is the single architecture reference (narrative, contract, quality, risks, inventory, and the mermaid diagram, merged 2026-09-18 from the former arc.yaml + arc.mmd + arc.schema.json) and must be updated in the same change as any edit to boundaries, data flow, module layout, or runtime contract. there is no separate human-prose architecture doc.",
    "bm25 tokenization is intentionally simple and documented as weak for CJK, thai, and lao.",
    "python/_urna.so must be rebuilt after Rust changes that touch urna-format, urna-runtime, or urna-python.",
    "forge-core is a separate cargo workspace OUTSIDE crates/ and must stay that way: its (eventually heavy) ingestion deps must never enter the sovereign workspace, and it is not built by the sovereign release gate, so it carries its own cargo build/test/fmt/clippy.",
]

