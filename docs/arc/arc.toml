    "python/embed_query.py",
    "python/model_fingerprint.py",
    "crates/urna-runtime/src/search.rs",
]
summary = "embed a query in python, validate name, dim, and model_hash, then route to exact, hnsw, or hybrid search"

[[flows]]
name = "cli-ask-retrieve"
entry = "crates/urna-cli/src/cmd/agent/ask.rs"
path = [
    "crates/urna-cli/src/cmd/embed_gate.rs",
    "python/forge/embed_query_potion.py",
    "python/forge/embed_query_model.py",
    "crates/urna-runtime/src/search.rs",
    "crates/urna-cli/src/cmd/agent/retrieve.rs",
]
summary = "the agent-native flagship: embed_gate::embed_and_search embeds the query OFFLINE routing by the manifest model (potion corpora keep the potion table byte-for-byte; any registry model goes through embed_query_model.py with the query-role encode and --mrl-dim for truncated default spaces), runs the ONE name/dim/model_hash gate shared with search-text, routes by manifest capability, then ask renders the cited canonical text (--disclose answer) or adds the rerank-source honesty line (--disclose explain) and retrieve emits the json/jsonl answer-pack where every hit score IS the exact rerank value with tier-1 text + hashes + citation_id"

[[flows]]
name = "python-retrieve"
entry = "crates/urna-python/src/retrieve_fn.rs"
path = [
    "python/forge/retrieve.py",
    "python/forge/embed_potion.py",
    "crates/urna-runtime/src/search.rs",
    "crates/urna-runtime/src/inspect.rs",
]
summary = "UrnaFile.retrieve(qvec, k): route by manifest capability, run search, attach tier-1 stored canonical text (canonical_texts) per chunk_id; forge/retrieve.py does the offline potion embed first and drives the one-gif demo over demo_corpus, fully offline and deterministic"

[[flows]]
name = "runtime-open-and-search"
entry = "crates/urna-runtime/src/mmap_file.rs"
path = [
    "crates/urna-format/src/reader/mod.rs",
    "crates/urna-runtime/src/search.rs",
    "crates/urna-runtime/src/simd/mod.rs",
]
summary = "open mmap, decode metadata and optional indices (ann/bm25/graph), and score rows directly from the embeddings section; embeddings stay raw, float16, or int8 so the runtime never has to zstd-decompress the hot path"

[[flows]]
name = "graph-search"
entry = "crates/urna-runtime/src/search.rs"
path = [
    "crates/urna-runtime/src/graph/csr.rs",
    "crates/urna-runtime/src/graph/traverse.rs",
    "crates/urna-runtime/src/search.rs",
]
summary = "search_graph seeds the exact-cosine top-ef, runs a generational-buffer bounded-bfs over the graph_adjacency (0x0C) csr to grow a candidate set, unions seed+frontier, then feeds the union to the SAME score_subset exact rerank; the graph only generates candidates (index_type=graph, recall=NaN), asserted by rerank_contract"

[[flows]]
name = "declarative-build"
entry = "python/tools/urna_forge.py"
path = [
    "python/forge/build_spec.py",
    "python/forge/corpus_sources.py",
    "python/forge/forge_pipeline.py",
    "python/forge/forge_media_stage.py",
    "python/forge/forge_recipe.py",
    "python/forge/model_registry.py",
    "python/forge/quality_gate.py",
    "python/forge/quality_utility.py",
    "python/forge/image_backends.py",
    "crates/urna-python/src/build_fn.rs",
]
summary = "load + validate the toml spec (unknown keys and non-total order_by are typed errors), load rows with per-item input_hash, dedup identical images, encode media (crf=auto dual gate: stratified ssimulacra2 floors AND embedding-drift floor; tune/speed/fps/jxl levers), embed each selected model once (flock'd caches content-addressed by the triad under `${XDG_CACHE_HOME:-~/.cache}/urna`, shared across specs; st models in isolated worker processes), slice validated mrl dims into named spaces, emit single and/or per-model files from the same vectors with atomic commit, and write manifest v1 + build.lock.json"

