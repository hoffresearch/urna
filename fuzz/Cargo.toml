[package]
name = "urna-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2024"

# its own workspace: cargo-fuzz needs nightly + sanitizer flags, so it
# must not be pulled into `cargo test --workspace` on stable.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
urna-format = { path = "../crates/urna-format" }
urna-runtime = { path = "../crates/urna-runtime" }

# reach the decoders with the checksum layer resealed (see fuzz_targets/
# reseal.rs); sha2 matches the workspace pin.
sha2 = "0.11"

[[bin]]
name = "urna-view"
path = "fuzz_targets/urna_view.rs"
test = false
doc = false
bench = false

[[bin]]
name = "section-decoders"
path = "fuzz_targets/section_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runtime-indexes"
path = "fuzz_targets/runtime_indexes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mmap-open-search"
path = "fuzz_targets/mmap_open_search.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
