[package]
name = "urna-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2024"

# its own workspace: cargo-fuzz needs nightly + sanitizer flags, so it
# must not be pulled into `cargo test --workspace` on stable.
[workspace]

[package.metadata]
cargo-fuzz = true

# a copy of the root [workspace.lints]: a workspace of its own inherits
# nothing. tool/tests/test_lintmatch.py fails when the two drift. no
# `unsafe_code = "forbid"` here: libfuzzer-sys's fuzz_target! expands to an
# `unsafe extern "C"` entry point.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
expect_used = "deny"

[dependencies]
libfuzzer-sys = "0.4"
urna-format = { path = "../rust/format" }
urna-engine = { path = "../rust/engine" }

[[bin]]
name = "urna-view"
path = "fuzz_targets/urna_view.rs"
test = false
doc = false
bench = false

[[bin]]
name = "section-decoders"
path = "fuzz_targets/section_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runtime-indexes"
path = "fuzz_targets/runtime_indexes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mmap-open-search"
path = "fuzz_targets/mmap_open_search.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
