# cargo-dist `github-build-setup` steps (see [workspace.metadata.dist] in
# Cargo.toml). injected into the release build jobs before anything builds.
# the embedder payload stages the potion table, which git checks out as an
# lfs pointer; tool/tasks/getpotion.sh downloads it from its upstream and
# verifies it against the pointer's sha256, so a release spends no lfs
# budget. every step needs a `name`, the dist template requires it.
- name: fetch the potion table (embedder payload), verified against its lfs pointer
  shell: bash
  run: sh tool/tasks/getpotion.sh
# a release build names the tag it builds, and rust/clitui/build.rs fails
# it when that tag is not `v` + the crate version. only on a tag push:
# GITHUB_REF_NAME is set in every job, and on a branch it is no release.
- name: name the release tag the binary builds for
  shell: bash
  run: |
    if [ "$GITHUB_REF_TYPE" = tag ]; then
      echo "URNA_RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
    fi
