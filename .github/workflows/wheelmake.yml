# build the `urna` wheels inside the release run. a reusable workflow:
# cargo-dist calls it as a custom local-artifacts job (`local-artifacts-jobs`
# in Cargo.toml), so the host job and every publish job wait for it and a
# wheel that does not build, or a tag that fails its signature or preflight
# (the first job here), stops the release before any channel publishes.
#
# one abi3 wheel per platform (cp312, matching pyo3 abi3-py312), built by
# maturin from the staged project (tool/tasks/wheelprep.py). each wheel gets a
# `<wheel>.sha256` (`<hex> *<name>`, the archives' format) and a sigstore
# build attestation. the upload is named `artifacts-wheel-*`, so the host job
# attaches the wheels and their checksums to the github release; pypiindex.yml
# publishes those same files and checks them against these checksums.

name: wheelmake

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# no permissions block, here or on the jobs: they take the caller's. the
# release grants id-token + attestations (github-custom-job-permissions in
# Cargo.toml); the rehearsal (rehearsal.yml) grants contents: read
# only, and a nested job may not ask for more than its caller gave.

jobs:
  # the release tag's signature and preflight. here rather than in dist's
  # plan phase so a refused tag fails this call and the host job never runs
  # (see the plan-jobs note in Cargo.toml); on a branch ref it is a no-op.
  tagverify:
    name: tag signature and preflight
    uses: ./.github/workflows/tagverify.yml

  wheels:
    name: wheel ${{ matrix.target }}
    needs: [tagverify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: fetch the potion table the wheel bundles (verified against its lfs pointer)
        shell: bash
        run: sh tool/tasks/getpotion.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: stage the wheel project
        run: python tool/tasks/wheelprep.py
      - name: build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: pkgs/stage
          target: ${{ matrix.target }}
          args: --release --out ../../dist-wheels
      - name: checksum each wheel
        shell: bash
        working-directory: dist-wheels
        run: |
          set -eu
          for wheel in *.whl; do
            python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest(), '*' + p)" "$wheel" > "$wheel.sha256"
            cat "$wheel.sha256"
          done
      - name: attest the wheels
        # the release tag push only: the rehearsal has no id-token to sign with.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-wheels/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-wheel-${{ matrix.target }}
          path: |
            dist-wheels/*.whl
            dist-wheels/*.whl.sha256
