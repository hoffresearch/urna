# the clean-machine check epic #535 asks of every pull request that touches
# setup: urna installed the way a first-time user meets it, with nothing on
# the machine, then `urna setup --model minilm-multilingual` end to end.
#
# - linux: tool/tasks/cleanhost.sh in a debian container with curl,
#   ca-certificates and xz-utils only (no python, no uv, no checkout): the
#   installer from a release of this tree, then setup downloads the uv the
#   catalogue names and builds its env on the catalogue's python range.
# - python315: a runner whose newest python is 3.15, which torch has no
#   wheels for (#529): setup must build its env inside the range, never on
#   the newest python, and the model must install there.
#
# the macOS leg (a disposable vanilla VM, where /usr/bin/python3 is Apple's
# stub) needs tart, which needs apple silicon with virtualization; github's
# macos runners offer no nested virtualization, so it runs on a developer
# mac: sh tool/tasks/cleanhost.sh macos --control.

name: cleanhost

on:
  pull_request:
    paths:
      - "rust/clitui/src/tui/setup/**"
      - "rust/clitui/src/cmd/health.rs"
      - "rust/clitui/src/cmd/paths.rs"
      - "rust/clitui/src/cmd/pyenv.rs"
      - "rust/bridge/python/urna/model/**"
      - "tool/tasks/installer.sh"
      - "tool/tasks/cleanhost.sh"
      - "tool/tasks/upstreams.py"
      - ".github/workflows/cleanhost.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux container, nothing installed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: install and set up urna in a clean container
        run: sh tool/tasks/cleanhost.sh linux

  python315:
    name: newest python is 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build urna and stage its payload as a release
        run: |
          cargo build --locked -p urna
          sh tool/tasks/getpotion.sh
          python tool/tasks/embedpack.py "$RUNNER_TEMP/stage" --tar "$RUNNER_TEMP/release/urna-embedder-payload.tar.gz"
      - name: setup builds its env inside the range, not on 3.15
        working-directory: ${{ runner.temp }}
        env:
          URNA_DATA_DIR: ${{ runner.temp }}/data
        run: |
          python --version | grep -q "^Python 3\.15\." || { python --version; exit 1; }
          if command -v uv; then echo "uv is on the runner: setup must download its own"; exit 1; fi
          export URNA_RELEASE_BASE="file://$RUNNER_TEMP/release"
          "$GITHUB_WORKSPACE/target/debug/urna" setup --yes --model minilm-multilingual
          test -x "$URNA_DATA_DIR/urna/bin/uv"
          "$URNA_DATA_DIR/urna/venv/bin/python" - "$URNA_DATA_DIR/urna/python/urna/model/catalogue.json" <<'PY'
          import json, sys
          spec = json.load(open(sys.argv[1]))["python"]["requires"]
          lo, hi = (int(p.split("3.")[1]) for p in spec.split(","))
          have = sys.version_info[:2]
          print(f"env python {have[0]}.{have[1]}, catalogue range {spec}")
          assert have[0] == 3 and lo <= have[1] < hi, "the env is outside the range"
          import sentence_transformers  # the model's package installed there
          PY
