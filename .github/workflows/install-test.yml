# post-release verification (issue #75): tests the INSTALLED product, not
# the build. for every released platform this downloads the release
# artifacts exactly the way a user does (one-liner installer against the
# release download url), then runs `urna validate` on the golden fixture
# and `urna doctor` with real numpy/tokenizers. a second job pip-installs
# the published wheel and repeats validate + the uvx console entry point.
#
# trigger: a published github release (created by the dist workflow), or
# manual dispatch with a tag. if this fails, the release is broken for
# users; yank and re-cut.

name: install-test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to test (e.g. v0.3.0)
        required: true

permissions:
  contents: read

jobs:
  cli:
    name: cli ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6 # scripts + golden fixture (not lfs)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install embedder python deps
        run: python -m pip install numpy tokenizers

      - name: install urna from the release (unix)
        if: runner.os != 'Windows'
        env:
          URNA_RELEASE_BASE: https://github.com/hoffresearch/urna/releases/download/${{ env.TAG }}
        run: sh scripts/install.sh

      - name: install urna from the release (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          URNA_RELEASE_BASE: https://github.com/hoffresearch/urna/releases/download/${{ env.TAG }}
        run: ./scripts/install.ps1

      - name: validate the golden fixture (unix)
        if: runner.os != 'Windows'
        env:
          URNA_PYTHON: python
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          urna validate crates/urna-format/tests/fixtures/golden_v1_minimal.urna
          urna doctor

      - name: validate the golden fixture (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          URNA_PYTHON: python
        run: |
          $env:PATH = "$HOME\.local\bin;$env:PATH"
          urna validate crates\urna-format\tests\fixtures\golden_v1_minimal.urna
          urna doctor

  wheel:
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6 # golden fixture
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install uv
        run: python -m pip install uv
      - name: pip install urna and validate
        run: |
          python -m pip install urna
          python -c "import urna; assert urna.potion_model_path(), 'potion table must be bundled'"
          python -c "import urna; urna.open('crates/urna-format/tests/fixtures/golden_v1_minimal.urna').validate(); print('validate ok')"
          urna validate crates/urna-format/tests/fixtures/golden_v1_minimal.urna
      - name: uvx entry point
        run: uvx --from urna urna validate crates/urna-format/tests/fixtures/golden_v1_minimal.urna
