# the release on Chocolatey: pkgs/choco/urna.nuspec and its install
# script, rendered by tool/tasks/pkgrender.py from the release's
# dist-manifest.json and sha256.sum, are packed with choco, installed from
# that package on this Windows runner and checked with `urna --version`,
# then pushed to the Chocolatey community repository, where moderators
# review it. a version the repository already holds is not pushed again.
#
# the install script downloads the release zip and checks it against the
# SHA-256 from sha256.sum; no binary travels inside the package. the push
# needs CHOCOLATEY_API_KEY, a repository secret: the API key of the
# hoffresearch account on community.chocolatey.org.
#
# trigger: cargo-dist calls it as a post-announce job
# (`post-announce-jobs` in Cargo.toml); or manual dispatch with a tag, to
# publish a release that already exists.

name: chocoship

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish, vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE: urna

jobs:
  ship:
    name: chocolatey package
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            pkgs/choco
            tool/tasks/pkgrender.py
          sparse-checkout-cone-mode: false
      - name: the release's manifest and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -n "$PLAN" ]; then
            tag="$(printf '%s' "$PLAN" | jq -r .announcement_tag)"
          else
            tag="$TAG_INPUT"
          fi
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $tag" >&2; exit 1 ;; esac
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p dist-manifest.json -p sha256.sum -D "$RUNNER_TEMP/rel"
          python tool/tasks/pkgrender.py render --channel choco \
            --manifest "$RUNNER_TEMP/rel/dist-manifest.json" \
            --sums "$RUNNER_TEMP/rel/sha256.sum" --out "$RUNNER_TEMP/render"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: skip a version the repository already holds
        id: have
        run: |
          set -eu
          url="https://community.chocolatey.org/api/v2/Packages(Id='${PACKAGE}',Version='${VERSION}')"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
          echo "status $code"
          if [ "$code" = 200 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: pack, install from the package, run
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/pkg"
          choco pack "$RUNNER_TEMP/render/choco/urna.nuspec" --out "$RUNNER_TEMP/pkg"
          choco install "$PACKAGE" --version "$VERSION" --source "$RUNNER_TEMP/pkg" -y --no-progress
          got="$(urna --version)"
          echo "$got"
          [ "$got" = "urna $VERSION" ] || { echo "expected urna $VERSION" >&2; exit 1; }
      - name: push to the community repository
        if: steps.have.outputs.skip == 'false'
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          set -eu
          choco push "$RUNNER_TEMP/pkg/${PACKAGE}.${VERSION}.nupkg" \
            --source https://push.chocolatey.org/ --api-key "$CHOCOLATEY_API_KEY"
