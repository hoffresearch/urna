# continuous integration for the rust workspace and the python surface.
#
# the release workflows run on tags; this is the pull-request gate. the
# push tier of `tool/tasks/fullcheck.sh` runs its commands locally, and
# tool/tasks/gatesteps.tsv maps each step to its local one or says why it
# has none (tool/tests/test_gatematch.py, below, fails a step without a
# line). CI runs no LFS corpus measurement (no LFS budget): fmt, clippy with the
# workspace deny lints (`unwrap_used`, `undocumented_unsafe_blocks`), the
# whole test suite on linux + macos (the aarch64 macos runner exercises the
# NEON kernels, the x86_64 linux runner the AVX2 ones), the 639-line guard,
# the deterministic mutation-fuzz harnesses at a higher iteration count,
# a bounded coverage-guided fuzz smoke on nightly, cargo-deny (advisories,
# licenses, bans, sources; policy in deny.toml) on the three cargo
# workspaces, cargo-semver-checks on urna-format's public api against the
# pull request's base commit, and (on the schedule or on demand) a
# 30-minute-per-target fuzz soak whose corpus carries over between nights
# plus urna-format's test suite under miri.

name: gatecheck

on:
  push:
    branches: [main]
  pull_request:
  # nightly soak: every cargo-fuzz target for 30 minutes with the corpus
  # carried over between nights. also on demand.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: seconds per fuzz target for the soak job
        required: false
        default: "1800"

permissions:
  contents: read

# a newer push to the same pull request supersedes its run in progress;
# every other run (a push to main, the schedule) is a group of its own, so
# none is cancelled or queued behind another.
concurrency:
  group: gatecheck-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# the stable jobs install the toolchain rust-toolchain.toml pins (`rustup
# toolchain install` with no name), which outranks any `rustup default`.
# the nightly jobs (fuzz, fuzz-soak, miri) need a nightly the file cannot
# name: NIGHTLY pins it, and each of them sets RUSTUP_TOOLCHAIN to it, the
# one setting that outranks the file. bumped with the stable pin
# (docs/CONTRIBUTING.md, "The toolchain").
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  NIGHTLY: nightly-2026-11-24

jobs:
  rust:
    name: rust ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    # the needs this job provides (tool/tests/testneeds.tsv): the potion
    # table (getpotion.sh) and the forge's python with the _urna extension,
    # both set up before the test step; lacking either fails the test.
    env:
      URNA_REQUIRE_LFS: "1"
      URNA_REQUIRE_FORGE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # tool/tests/testneeds.py: each test that lacks a need logs it here,
      # and the last step lists them (a required one fails the job).
      - name: the skip log
        shell: bash
        run: echo "URNA_SKIP_LOG=$RUNNER_TEMP/skips.log" >> "$GITHUB_ENV"
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (workspace deny lints)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (engine-only cli, no terminal ui)
        run: cargo clippy -p urna --no-default-features --all-targets -- -D warnings
      # #645: zstd is decoded by urna-format's own decoder, the zstd crate
      # (libzstd, C) only writes. the readers must build, lint clean and
      # resolve without it.
      - name: the read path links no C (urna-format without write, engine, cbinds)
        run: |
          cargo clippy -p urna-format --no-default-features -- -D warnings
          cargo clippy -p urna-engine -p urna-cbinds -- -D warnings
          if cargo tree -p urna-engine -p urna-cbinds -e normal,build | grep zstd; then
            echo "a reader depends on the zstd crate" >&2
            exit 1
          fi
      - name: build
        run: cargo build --workspace --all-targets
      # a binary built from a branch or main never takes a release's name,
      # so its `urna setup` never fetches that release's payload (#530).
      - name: a ci build is a development build
        run: |
          v=$(./target/debug/urna --version)
          echo "$v"
          case "$v" in
            *+dev.*) ;;
            *) echo "expected a development build name (<version>+dev.<sha>), got: $v" >&2; exit 1 ;;
          esac
      # the checkout carries the potion table as an lfs pointer; `urna doctor`
      # and the in-process embed need the table itself, fetched from hugging
      # face at the pinned revision and checked against the pointer's oid.
      - name: fetch the potion table (embedder payload), verified against its lfs pointer
        run: sh tool/tasks/getpotion.sh
        shell: bash
      # the forge need: cli_e2e's ask and retrieve build their demo corpus
      # through the urna package (the _urna extension) with the potion
      # embedder's numpy + tokenizers (pyproject's forge group), and the
      # potion parity runs the reference script; the setup-python python3
      # is the first one they find on PATH.
      - name: the forge's python and the _urna extension
        run: |
          python -m pip install "numpy>=1.26" "tokenizers>=0.20"
          PYO3_PYTHON="$(command -v python)" cargo build -p urna-bridge --features pyo3/extension-module
          case "$(uname)" in
            Darwin) cp target/debug/lib_urna.dylib rust/bridge/python/urna/_urna.so ;;
            *) cp target/debug/lib_urna.so rust/bridge/python/urna/_urna.so ;;
          esac
      # hnsw_recall's graph_bytes_are_pinned prints the digests and asserts
      # nothing while PIN_HNSW_DIGESTS is set (the re-pin mode).
      - name: the hnsw digest re-pin mode is off
        run: |
          if [ -n "${PIN_HNSW_DIGESTS+set}" ]; then
            echo "PIN_HNSW_DIGESTS is set: graph_bytes_are_pinned would check nothing" >&2
            exit 1
          fi
      # cargo-nextest runs each test in a process of its own and every test
      # binary in parallel (.config/nextest.toml); the local push tier runs
      # the same profile. nextest runs no doctest, so `cargo test --doc`
      # follows it.
      - name: install cargo-nextest (pinned release, checksum verified)
        env:
          NEXTEST_VERSION: "0.9.148"
          NEXTEST_SHA256_LINUX: 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc
          NEXTEST_SHA256_MACOS: 6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux) asset=x86_64-unknown-linux-gnu; sum="$NEXTEST_SHA256_LINUX" ;;
            macOS) asset=universal-apple-darwin; sum="$NEXTEST_SHA256_MACOS" ;;
            *) echo "no cargo-nextest pinned for $RUNNER_OS" >&2; exit 1 ;;
          esac
          tarball="cargo-nextest-${NEXTEST_VERSION}-$asset.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/$tarball"
          echo "$sum  $RUNNER_TEMP/$tarball" | shasum -a 256 -c -
          # the macOS image has rustup but no ~/.cargo/bin until something is
          # installed there: make it, and put it on PATH for the later steps.
          bindir="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bindir"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$bindir"
          echo "$bindir" >> "$GITHUB_PATH"
          export PATH="$bindir:$PATH"
          cargo nextest --version
      - name: test
        run: |
          cargo nextest run --workspace --profile ci
          cargo test --workspace --doc
      # rust/clitui/parity is a workspace of its own: coolor, the crate the
      # cli's xterm-256 fold replaced, never enters the urna build or lock.
      - name: color fold parity against coolor (rust/clitui/parity)
        run: cargo test --locked --manifest-path rust/clitui/parity/Cargo.toml
      - name: benches compile (numbers are not a gate on shared runners)
        run: cargo bench -p urna-engine --no-run
      - name: mutation fuzz (deterministic, higher count)
        env:
          URNA_MUTATION_ITERS: "6000"
        run: |
          cargo test --release -p urna-format --test mutation_fuzz
          URNA_MUTATION_ITERS=800 cargo test --release -p urna-engine --test mutation_fuzz
      - name: 639-line guard (rust/**/src)
        run: |
          # rust/av1dec is the rav1d fork vendored whole; its files keep upstream's shape
          overlong="$(find rust -name '*.rs' -path '*/src/*' -not -path '*/tests/*' -not -path '*/target/*' -not -path 'rust/av1dec/*' \
            -exec wc -l {} + | awk '$1 > 639 {print}' | grep -v 'total$' || true)"
          if [ -n "$overlong" ]; then echo "$overlong"; exit 1; fi
      - name: rust/ingest (separate workspace)
        run: |
          cargo fmt --manifest-path rust/ingest/Cargo.toml --all --check
          cargo clippy --manifest-path rust/ingest/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/ingest/Cargo.toml
      - name: fuzz/ lints (separate workspace; the targets run on nightly below)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: what did not run (tool/tests/testneeds.py report)
        if: ${{ !cancelled() }}
        shell: bash
        run: python tool/tests/testneeds.py report "$URNA_SKIP_LOG"

  # the terminal ui (`urna setup`, `urna tui`) ships in the windows
  # release archive too, and the rust job above never compiles for windows:
  # this job is the only check of the crossterm/console path, the
  # `Scripts\python.exe` venv layout and the `%LOCALAPPDATA%` data root
  # before a tag. unit tests + the file:// setup end to end.
  cli-windows:
    name: cli windows (setup + tui)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    # the potion table comes from getpotion.sh; no forge python here, so the
    # potion parity in --bins is a logged skip of the forge need.
    env:
      URNA_REQUIRE_LFS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # tool/tests/testneeds.py: each test that lacks a need logs it here,
      # and the last step lists them (a required one fails the job).
      - name: the skip log
        shell: bash
        run: echo "URNA_SKIP_LOG=$RUNNER_TEMP/skips.log" >> "$GITHUB_ENV"
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy
        run: cargo clippy -p urna --all-targets -- -D warnings
      # the checkout carries the potion table as an lfs pointer; `urna doctor`
      # and the in-process embed need the table itself, fetched from hugging
      # face at the pinned revision and checked against the pointer's oid.
      - name: fetch the potion table (embedder payload), verified against its lfs pointer
        run: sh tool/tasks/getpotion.sh
        shell: bash
      - name: test (unit + setup end to end)
        run: cargo test -p urna --bins --test setup_e2e
      - name: what did not run (tool/tests/testneeds.py report)
        if: ${{ !cancelled() }}
        shell: bash
        run: python tool/tests/testneeds.py report "$URNA_SKIP_LOG"

  # the forge's potion embedder runs in Rust through the urna-cbinds C ABI
  # (urna/_cabi.py, ctypes; #643) and keeps numpy + tokenizers only as its
  # reference. this job builds the library and holds the two paths to the
  # same token ids, vectors (1e-6) and model_hash; no skip is allowed here.
  potion-native:
    name: potion through the C ABI (ctypes) against numpy + tokenizers
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fetch the potion table, verified against its lfs pointer
        run: sh tool/tasks/getpotion.sh
      - name: build the C ABI library
        run: cargo build --release -p urna-cbinds
      - name: the reference side
        run: python -m pip install numpy tokenizers
      # the library (native) and numpy + tokenizers (forge) are both
      # installed above: the parity may skip neither.
      - name: native and reference agree
        env:
          URNA_REQUIRE_NATIVE: "1"
          URNA_REQUIRE_FORGE: "1"
        run: |
          URNA_CBINDS="$PWD/target/release/liburna_cbinds.so" python tool/tests/test_potiontab.py

  # rust/images/parity is a workspace of its own (the crates.io rav1d and
  # avif-decode stay out of urna's lock and cargo-deny), so the rust job never
  # builds it. this job is the proof that urna-av1dec, the rav1d fork with
  # its own locks, atomics, enums, flags and byte casts (rust/av1dec/UPSTREAM),
  # still decodes like upstream: avifenc encodes a set of synthetic 4:2:0
  # stills (odd sizes, tiles, low and high quality) and every plane must
  # match the crates.io rav1d sample for sample. the card corpus pass of
  # fullcheck.sh (URNA_CARDS_CORPUS) is the larger local run.
  av1-parity:
    name: av1 parity (urna-av1dec against crates.io rav1d)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust/images/parity
      # nasm: avif-decode pulls the crates.io rav1d with its default features,
      # so the reference is built with its x86 asm (bit-exact by the spec,
      # and a reference independent of our pure-Rust kernels).
      - name: avifenc and nasm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libavif-bin nasm
      - name: encode the AVIF inputs
        run: |
          set -eu
          dir="$RUNNER_TEMP/avif"
          mkdir -p "$dir"
          python3 - "$dir" <<'PY'
          import sys
          out = sys.argv[1]
          state = 1
          def noise():
              global state
              state = (state * 1103515245 + 12345) & 0x7FFFFFFF
              return state >> 23
          for w, h in [(64, 64), (127, 93), (320, 240), (513, 257), (640, 480)]:
              y = bytearray()
              for r in range(h):
                  for c in range(w):
                      if c < w // 3:
                          v = (c * 255 // max(w // 3, 1) + r) & 0xFF
                      elif c < 2 * w // 3:
                          v = noise()
                      else:
                          v = 230 if ((r // 8) + (c // 8)) % 2 else 20
                      y.append(v)
              cw, ch = (w + 1) // 2, (h + 1) // 2
              u = bytes((r * 255 // ch + noise() // 16) & 0xFF for r in range(ch) for c in range(cw))
              v = bytes((c * 255 // cw) & 0xFF for r in range(ch) for c in range(cw))
              with open(f"{out}/{w}x{h}.y4m", "wb") as f:
                  f.write(f"YUV4MPEG2 W{w} H{h} F25:1 Ip A1:1 C420jpeg\n".encode())
                  f.write(b"FRAME\n" + bytes(y) + u + v)
          PY
          for src in "$dir"/*.y4m; do
            base="${src%.y4m}"
            avifenc -s 8 -q 60 "$src" "$base-s8q60.avif"
            avifenc -s 4 -q 25 "$src" "$base-s4q25.avif"
            avifenc -s 6 -q 95 --tilerowslog2 1 --tilecolslog2 1 "$src" "$base-s6q95tiles.avif"
          done
          ls -l "$dir"/*.avif
      - name: every plane of every input matches the crates.io rav1d
        env:
          URNA_REQUIRE_AVIF: "1"
        run: |
          URNA_AVIF_DIR="$RUNNER_TEMP/avif" cargo test --release \
            --manifest-path rust/images/parity/Cargo.toml --test planes -- --nocapture

  # rust/format/parity is a workspace of its own (the crates urna-format
  # replaced live only there: half, sha2 and libzstd), so the rust job never
  # builds it. it holds the f16 conversion, SHA-256 and the zstd decoder
  # (#645) to those references. both arches: the reference takes the f16 and
  # sha instructions where the cpu has them, and so does our code, so x86_64
  # linux and aarch64 macos each hold a different hardware path to it.
  format-parity:
    name: format parity ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust/format/parity
      # tool/tests/testneeds.py: each test that lacks a need logs it here,
      # and the last step lists them (a required one fails the job).
      - name: the skip log
        shell: bash
        run: echo "URNA_SKIP_LOG=$RUNNER_TEMP/skips.log" >> "$GITHUB_ENV"
      # no lfs here: a .urna tracked through git-lfs is a logged skip of
      # the lfs need (the fixtures are plain git).
      - name: f16, sha-256 and the zstd decoder against the crates they replaced
        run: cargo test --release --manifest-path rust/format/parity/Cargo.toml
      - name: what did not run (tool/tests/testneeds.py report)
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 tool/tests/testneeds.py report "$URNA_SKIP_LOG"

  fuzz:
    name: cargo-fuzz smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: nightly toolchain (NIGHTLY)
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$NIGHTLY" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: seed corpora
        run: |
          cd fuzz
          for t in urna-view section-decoders runtime-indexes mmap-open-search zstd-decoder; do
            mkdir -p corpus/$t
            cp seeds/*.bin ../rust/format/tests/fixtures/golden_v1_minimal.urna corpus/$t/
          done
      - name: run every target (bounded)
        run: |
          cd fuzz
          for t in urna-view section-decoders runtime-indexes zstd-decoder; do
            cargo fuzz run $t -- -max_total_time=90 -max_len=65536
          done
          cargo fuzz run mmap-open-search -- -max_total_time=90 -max_len=65536 -rss_limit_mb=4096
      - name: keep any crash artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: workspace (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
      - name: rust/ingest (separate workspace)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
          manifest-path: rust/ingest/Cargo.toml
          # rust/ingest carries no syn 2, so the workspace-wide skip in
          # deny.toml goes unmatched there (one policy file, three workspaces).
          command-arguments: -A unmatched-skip
      - name: fuzz (separate workspace)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
          manifest-path: fuzz/Cargo.toml
          # no syn 2 in fuzz either since urna-format dropped `half`.
          command-arguments: -A unmatched-skip
  semver:
    name: semver (urna-format public api)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the baseline is a rev, not a published crate
          persist-credentials: false
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # a base commit without the urna-format package has nothing to compare
      # against; skip instead of failing. found by package name, not by path:
      # cargo-semver-checks finds the baseline the same way, so a base from
      # before a folder move still compares.
      - name: baseline has urna-format
        id: baseline
        run: |
          if git grep -q '^name = "urna-format"' "${{ github.event.pull_request.base.sha }}" -- '*Cargo.toml'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::base commit has no urna-format package; semver check skipped"
          fi
      # the on-disk format is frozen; the rust api that reads it should say
      # when it breaks. the baseline is the pr's base commit, not the last
      # version on crates.io, so a break is caught before it ships. in 0.x
      # a minor bump is the major bump, which the tool understands.
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        if: steps.baseline.outputs.present == 'true'
        with:
          package: urna-format
          baseline-rev: ${{ github.event.pull_request.base.sha }}
  fuzz-soak:
    name: cargo-fuzz soak ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [urna-view, section-decoders, runtime-indexes, mmap-open-search, zstd-decoder]
    env:
      TARGET: ${{ matrix.target }}
      SOAK_SECONDS: ${{ inputs.seconds || 1800 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: nightly toolchain (NIGHTLY)
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$NIGHTLY" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # the corpus accumulates across nights: restore the newest one, seed
      # only when nothing was restored, minimize before saving.
      - name: restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: seed corpus if empty
        run: |
          cd fuzz
          mkdir -p "corpus/$TARGET"
          if [ -z "$(ls -A "corpus/$TARGET")" ]; then
            cp seeds/*.bin ../rust/format/tests/fixtures/golden_v1_minimal.urna "corpus/$TARGET/"
          fi
      - name: soak
        run: |
          cd fuzz
          cargo fuzz run "$TARGET" -- \
            -max_total_time="$SOAK_SECONDS" -max_len=65536 -rss_limit_mb=4096
      - name: minimize corpus
        if: always()
        run: cd fuzz && cargo fuzz cmin "$TARGET" || true
      - name: keep any crash artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-soak-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  miri:
    name: miri (urna-format)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: nightly toolchain with miri (NIGHTLY)
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri
          echo "RUSTUP_TOOLCHAIN=$NIGHTLY" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: miri setup
        run: cargo miri setup
      # urna-format's only `unsafe` is the SHA instruction kernels, which
      # miri never runs (cfg(miri) takes the portable rounds); this turns
      # "no undefined behaviour" from a claim into a run over its parsers
      # and codecs. tests that call zstd (c code miri cannot run) and the
      # fsst table build (too slow under an interpreter) are marked in the
      # source with the reason; the mutation and property harnesses run
      # natively in the rust job instead.
      - name: urna-format under miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows
        run: cargo miri test -p urna-format

  python:
    name: python
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the rehearsal impact cases read real history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # tool/tests/testneeds.py: each test that lacks a need logs it here,
      # and the last step lists them (a required one fails the job).
      - name: the skip log
        shell: bash
        run: echo "URNA_SKIP_LOG=$RUNNER_TEMP/skips.log" >> "$GITHUB_ENV"
      # pyproject.toml's gate group: pyyaml (the workflow readers) and ruff,
      # what the local gate's .venv holds too. pip reads --group from 25.1.
      - name: the gate's python tooling (pyproject.toml's gate group)
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group gate
      - name: ruff (same file list as fullcheck.sh)
        run: URNA_PYTHON=python sh tool/tasks/ruffcheck.sh
      - name: names follow the length table and the lexicon
        # the naming rule of docs/CONTRIBUTING.md: siblings of the same kind have the same
        # length, the exceptions are listed, docs/TERMS.md holds every
        # abbreviation once; reads the tracked files only.
        run: |
          python tool/tasks/namecheck.py
          python tool/tests/test_namecheck.py
      - name: urna keeps its import contracts
        # pyproject.toml's [tool.layerscan], checked over the ast of every
        # urna module (urna imports no module of tool/bench).
        run: |
          python tool/tasks/layerscan.py
          python tool/tests/test_layerscan.py
      - name: the atlas summary is the current state, not history
        run: python tool/tests/test_atlasdocs.py
      - name: a test that lacks a need fails where it is required, else logs the skip
        # tool/tests/testneeds.py, which the suites that can lack a resource
        # call; and the lexical floor embedder, stdlib only.
        run: |
          python tool/tests/test_testneeds.py
          python tool/tests/test_lexifloor.py
      - name: rust/ingest keeps the root's lints and rust-version
        run: python tool/tests/test_lintmatch.py
      - name: the registry imports and the model catalog is current
        # bare python, no ml deps: catalogue imports the whole registry,
        # so a preset that names a field ModelPreset lacks fails here, and a
        # catalogue.json the registry no longer produces fails too.
        run: |
          python rust/bridge/python/urna/model/catalogue.py --check
          python tool/tests/test_upstreams.py
      - name: the model_hash and offline guarantees
        # test_stbackend pins the st_multimodal model_hash of a synthetic
        # snapshot (the fingerprint's key names are hashed); test_nonetwork
        # checks that the search-text embedder, the registry and the image
        # path force the hub offline unless URNA_ALLOW_DOWNLOAD=1. both
        # import numpy (stbackend, visionemb), nothing heavier, and
        # --models none never loads a model (#488). after the
        # catalog step, which stays a bare-python check.
        run: |
          python -m pip install numpy
          python tool/tests/test_stbackend.py --models none
          python tool/tests/test_nonetwork.py
      - name: the release version agrees everywhere a release names it
        # pins, lockfile, CITATION.cff and the changelog section; the tag
        # checks run in tagverify.yml when a release is cut.
        run: |
          python tool/tasks/preflight.py
          python tool/tests/test_preflight.py
          python tool/tests/test_pypiindex.py
      - name: release.yml is dist's output with distpatch.py's edits
        # dist has no setting for these edits, and allow-dirty keeps its plan
        # from checking the file, so this does: the pinned dist regenerates
        # release.yml, distpatch.py edits it, and a hand edit that drifts fails.
        env:
          DIST_VERSION: "0.32.0"
          DIST_SHA256: eb52f9fae0d0506774e9f1801c1168f87fa2c87a45e2d64d3ae7c89401929946
        run: |
          set -eu
          tarball=cargo-dist-x86_64-unknown-linux-gnu.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/$tarball"
          echo "$DIST_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          DIST="$RUNNER_TEMP/cargo-dist-x86_64-unknown-linux-gnu/dist" python tool/tasks/distpatch.py generate --check
          python tool/tests/test_distpatch.py
      - name: the release rehearsal is what release.yml builds
        # rehearsal.yml is generated from release.yml; a dist upgrade
        # or a hand edit that drifts fails here.
        run: |
          python tool/tasks/rehearsal.py generate --check
          python tool/tests/test_rehearsal.py
      - name: every check CI runs has its local step or the reason it has none
        # tool/tasks/gatesteps.tsv against this workflow, lintworks.yml and
        # the tiers of tool/tasks/fullcheck.sh (pyyaml: the gate group).
        run: python tool/tests/test_gatematch.py
      - name: the release waits for and reports the exact version
        # against a local http server: the registry waits, the crates
        # publisher's outage handling, the report of a failed release.
        run: python tool/tests/test_chanprobe.py
      - name: each channel's manifest comes from the release
        # the templates in pkgs/ against v0.5.4's archives and hashes: every
        # url and hash the release's, texts escaped, a bad input writes nothing.
        run: python tool/tests/test_pkgrender.py
      - name: the PPA's source package comes from the tag
        # debian/ filled from the workspace texts in control syntax, the
        # vendored crates keep their own checksum, a wrong tag writes nothing.
        run: python tool/tests/test_ppasource.py
      - name: urna.dev/apt's Cloudflare setup stays inside its route
        # against a recorder for the Cloudflare API: created once, kept on a
        # second run, a wider or taken route refused, worker.js uploaded as is.
        run: python tool/tests/test_aptserver.py
      - name: what did not run (tool/tests/testneeds.py report)
        if: ${{ !cancelled() }}
        shell: bash
        run: python tool/tests/testneeds.py report "$URNA_SKIP_LOG"

  payload-py310:
    name: payload staged under python 3.10
    if: github.event_name != 'schedule'
    # the release's global job stages the payload with ubuntu-22.04's python3
    # (3.10); the 0.5.2 tag failed there on a 3.11 import.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: stage and pack the payload, check its VERSION
        run: |
          set -eu
          sh tool/tasks/getpotion.sh
          python tool/tasks/embedpack.py "$RUNNER_TEMP/payload" --tar "$RUNNER_TEMP/payload.tar.gz"
          python -c "import sys, tarfile; v = tarfile.open(sys.argv[1]).extractfile('urna/VERSION').read().decode().strip(); print('payload VERSION', v)" "$RUNNER_TEMP/payload.tar.gz"
