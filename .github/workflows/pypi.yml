# pypi release for the `urna` wheel (issue #75).
#
# one abi3 wheel per platform (cp312, matching pyo3 abi3-py312), built by
# maturin from the staged project (scripts/stage_wheel.py), published with
# OIDC trusted publishing + pep 740 attestations (no stored token). the
# manual cargo+cp build stays the dev path; this workflow only feeds the
# published package.
#
# trigger: pushing a v* tag on main (same tag that drives the dist release);
# the tag's signature is verified first (tag-verify.yml).
# prerequisite (one-time, external): the `pypi` environment and the trusted
# publisher entry for this repo must exist on PyPI; see the maintainer checklist in docs/usage.md.

name: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-verify:
    name: tag signature
    if: github.event_name == 'push'
    uses: ./.github/workflows/tag-verify.yml

  wheels:
    name: wheel ${{ matrix.target }}
    needs: [tag-verify]
    if: always() && (needs.tag-verify.result == 'success' || needs.tag-verify.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true # the wheel bundles the potion table (git-lfs)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: stage the wheel project
        run: python scripts/stage_wheel.py
      - name: build the abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packaging/staging
          target: ${{ matrix.target }}
          args: --release --out ../../dist-wheels
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist-wheels/*.whl

  publish:
    name: publish urna to pypi
    needs: [wheels]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing + pep 740 attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
