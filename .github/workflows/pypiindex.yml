# publish the `urna` wheels to pypi (or testpypi) with OIDC trusted
# publishing and pep 740 attestations. a top-level workflow on purpose: pypi
# matches the publisher on `job_workflow_ref`, and its docs do not support a
# reusable workflow as the publisher, which every cargo-dist custom job is.
# so the release run's pypiready job (pypiready.yml) dispatches this
# workflow on the tag and waits for this run; nothing here builds.
#
# two paths, chosen by `index`, never mixed:
#
# - pypi: dispatched on a tag ref. the tag is signed and passes the
#   preflight (tagverify.yml); `source_run` is the release.yml run of that
#   tag whose host job succeeded; the wheels and their .sha256 come from the
#   github release that host made, and each wheel's build attestation is
#   verified against the signer workflow (wheelmake.yml), the tag's commit
#   and the tag's ref. the files pypi gets are the release's files.
# - testpypi: dispatched on main, to prove the publisher before a release.
#   `source_run` is a successful rehearsal.yml run on a commit of
#   main; the wheels and checksums come from that run's artifacts (the
#   rehearsal makes no attestations). this path can only reach testpypi.
#
# the upload is idempotent (tool/tasks/pypiindex.py plan): a wheel the
# index already has with the same sha256 is skipped, one with another
# sha256 fails, the rest are uploaded, so a rerun after a partial upload
# finishes it. a manual dispatch goes through the same checks.
#
# prerequisite (one-time, external): a trusted publisher on pypi and on
# testpypi for this file (`pypiindex.yml`) with the environment of the same name
# as the index; see the maintainer checklist in docs/USAGE.md.

name: pypiindex

on:
  workflow_dispatch:
    inputs:
      index:
        description: where to publish (pypi from a tag, testpypi from main)
        required: true
        type: choice
        options: [pypi, testpypi]
      source_run:
        description: the run that built the wheels (release.yml for pypi, rehearsal.yml for testpypi)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  ref:
    name: the ref fits the index
    runs-on: ubuntu-24.04
    steps:
      - env:
          INDEX: ${{ inputs.index }}
        run: |
          set -eu
          case "$INDEX:$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            pypi:tag:v*) ;;
            testpypi:branch:main) ;;
            *) echo "::error::$INDEX publishes from a v* tag (pypi) or from main (testpypi), not $GITHUB_REF_TYPE $GITHUB_REF_NAME"; exit 1 ;;
          esac

  tagverify:
    name: tag signature and preflight
    needs: [ref]
    if: inputs.index == 'pypi'
    uses: ./.github/workflows/tagverify.yml

  publish:
    name: publish urna to ${{ inputs.index }}
    needs: [ref, tagverify]
    if: always() && needs.ref.result == 'success' && (needs.tagverify.result == 'success' || (inputs.index == 'testpypi' && needs.tagverify.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: ${{ inputs.index }}
    permissions:
      contents: read
      actions: read # the source run and its artifacts
      attestations: read
      id-token: write # trusted publishing + pep 740 attestations
    env:
      GH_TOKEN: ${{ github.token }}
      INDEX: ${{ inputs.index }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the source run is the one this index allows
        run: python3 tool/tasks/pypiindex.py source --index "$INDEX" --run "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --sha "$(git rev-parse HEAD)"
      - name: version
        id: version
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: the wheels and checksums of the github release (pypi)
        if: inputs.index == 'pypi'
        run: |
          set -eu
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -D dist -p '*.whl' -p '*.whl.sha256'
          # built by wheelmake.yml from this tag's commit and ref, not just
          # somewhere in this repository.
          for wheel in dist/*.whl; do
            gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/wheelmake.yml" \
              --source-digest "$(git rev-parse HEAD)" --source-ref "$GITHUB_REF"
          done
      - name: the wheels and checksums of the rehearsal run (testpypi)
        if: inputs.index == 'testpypi'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-wheel-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: which wheels the index still needs (same sha256 skipped, another fails)
        id: plan
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tool/tasks/pypiindex.py plan --index "$INDEX" --dir dist --version "$VERSION" --out upload
      - name: publish to pypi
        if: inputs.index == 'pypi' && steps.plan.outputs.upload != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload/
      - name: publish to testpypi
        if: inputs.index == 'testpypi' && steps.plan.outputs.upload != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload/
          repository-url: https://test.pypi.org/legacy/
