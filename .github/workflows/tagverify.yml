# verify the release tag's signature. a reusable workflow: wheelmake.yml
# calls it as its first job inside the release run (a failure there stops
# the host job, see the plan-jobs note in Cargo.toml), and pypiindex.yml calls it
# before a pypi upload. an unsigned tag, or one signed by a key not listed
# in .github/trustkeys, fails the release before anything is uploaded. after the signature,
# tool/tasks/preflight.py checks the tag names the workspace version,
# its commit is on main (fetch-depth 0 brings origin/main) and every file a
# release versions agrees (pins, lockfile, CITATION.cff, changelog).
#
# to sign a tag locally: `git config tag.gpgsign true` (ssh signing key
# already configured for commits), then `git tag vX.Y.Z -m "vX.Y.Z"`.

name: tagverify

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: tag to verify (defaults to the ref that triggered the run)
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: verify tag signature
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: verify
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          if [ -z "${{ inputs.tag }}" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::notice::$TAG is a branch ref (pull request plan run), nothing to verify"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG^{tag}" >/dev/null; then
            echo "::error::$TAG is not an annotated tag (lightweight tags carry no signature)"
            exit 1
          fi
          git -c gpg.ssh.allowedSignersFile=.github/trustkeys verify-tag "$TAG"
          echo "tag $TAG: signature verified against .github/trustkeys"
      - name: version and origin (the tag names the workspace version, on main)
        if: inputs.tag != '' || github.ref_type == 'tag'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tool/tasks/preflight.py --tag "$TAG" --main-ref origin/main
