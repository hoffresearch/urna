# post-release verification (issue #75): tests the INSTALLED product, not
# the build. for every released platform this downloads the release
# artifacts exactly the way a user does (one-liner installer against the
# release download url), then runs `urna validate` on the golden fixture
# and `urna doctor` with real numpy/tokenizers. a second job installs the
# binary through each package channel (homebrew, npm, bun, pnpm, yarn,
# cargo binstall), which ships the bare binary, and proves `urna setup
# --yes` completes it:
# payload from the tagged release, a python env built from a runner python
# that has no numpy, then `urna doctor`. a third job pip-installs the
# published wheel and repeats validate + the uvx console entry point.
#
# trigger: cargo-dist calls it as a post-announce job (`post-announce-jobs`
# in Cargo.toml), so it runs inside the release run once every channel has
# published; or manual dispatch with a tag. it cannot listen for
# `release: published`: the release is created with GITHUB_TOKEN, and
# events from that token start no workflows. if this fails, the release is
# broken for users: crates.io and pypi versions are permanent, so the fix
# is a per-channel decision, usually the next patch.

name: setuptest

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to test (e.g. v0.3.0)
        required: true

permissions:
  contents: read

jobs:
  cli:
    name: cli ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0: tool/tasks/ + golden fixture (not lfs)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install embedder python deps
        run: python -m pip install numpy tokenizers

      - name: install urna from the release (unix)
        if: runner.os != 'Windows'
        env:
          URNA_RELEASE_BASE: https://github.com/hoffresearch/urna/releases/download/${{ env.TAG }}
        run: sh tool/tasks/installer.sh

      - name: install urna from the release (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          URNA_RELEASE_BASE: https://github.com/hoffresearch/urna/releases/download/${{ env.TAG }}
        run: ./tool/tasks/installer.ps1

      - name: validate the golden fixture (unix)
        if: runner.os != 'Windows'
        # from outside the checkout: in the repo the embedder resolves to
        # rust/bridge/python/urna first, whose potion table is an lfs pointer here.
        working-directory: ${{ runner.temp }}
        env:
          URNA_PYTHON: python
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # the installed binary is the tagged version, exactly.
          test "$(urna --version)" = "urna ${TAG#v}"
          urna validate "$GITHUB_WORKSPACE/rust/format/tests/fixtures/golden_v1_minimal.urna"
          urna doctor

      - name: validate the golden fixture (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          URNA_PYTHON: python
        # pwsh reports only the last command's exit code, so each native
        # command is checked on its own: a failed validate is not hidden by a
        # passing doctor.
        run: |
          $env:PATH = "$HOME\.local\bin;$env:PATH"
          $expected = "urna $($env:TAG.TrimStart('v'))"
          $shown = (urna --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $shown -ne $expected) { Write-Error "urna --version: '$shown' (exit $LASTEXITCODE), expected '$expected'"; exit 1 }
          urna validate "$env:GITHUB_WORKSPACE\rust\format\tests\fixtures\golden_v1_minimal.urna"
          if ($LASTEXITCODE -ne 0) { Write-Error "urna validate exited $LASTEXITCODE"; exit $LASTEXITCODE }
          urna doctor
          if ($LASTEXITCODE -ne 0) { Write-Error "urna doctor exited $LASTEXITCODE"; exit $LASTEXITCODE }

  channels:
    name: ${{ matrix.channel }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: homebrew, os: macos-latest }
          - { channel: homebrew, os: ubuntu-24.04 }
          - { channel: npm, os: ubuntu-24.04 }
          - { channel: npm, os: macos-latest }
          - { channel: npm, os: windows-latest }
          - { channel: binstall, os: ubuntu-24.04 }
          # the same @urna/cli package through the other node package managers.
          - { channel: bun, os: ubuntu-24.04 }
          - { channel: bun, os: macos-latest }
          - { channel: pnpm, os: ubuntu-24.04 }
          - { channel: pnpm, os: macos-latest }
          - { channel: yarn, os: ubuntu-24.04 }
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0: golden fixture
      # a bare interpreter on purpose: setup must build the numpy +
      # tokenizers env itself (pip path; uv is not on the runner).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: contains(fromJSON('["npm", "pnpm", "yarn"]'), matrix.channel)
        with:
          node-version: "22"

      - name: wait for the exact version on the registry
        # a registry can serve a new version minutes after the publish job
        # ends (npm answered ETARGET on 0.5.3); wait for it, bounded, so a
        # leg fails only when the version really is not there.
        if: matrix.channel != 'homebrew'
        run: |
          case "${{ matrix.channel }}" in
            binstall) channel=crates ;;
            *) channel=npm ;;
          esac
          python tool/tasks/chanprobe.py wait --channel "$channel" --version "${TAG#v}" --timeout 900
      - name: install (homebrew)
        if: matrix.channel == 'homebrew'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew install hoffresearch/urna/urna
          dirname "$(brew --prefix)/bin/urna" >> "$GITHUB_PATH"
      - name: install (npm)
        if: matrix.channel == 'npm'
        run: npm install -g "@urna/cli@${TAG#v}"
      - name: install (bun)
        if: matrix.channel == 'bun'
        # bun blocks the package's postinstall; the wrapper fetches the
        # binary on the first run instead, which the next step exercises.
        # the wrapper is a node script (`#!/usr/bin/env node`): these legs
        # pass because the runner image ships node, not because bun runs it.
        # a machine with bun and no node gets exit 127 from `urna`; the
        # usage doc's npm section says so and names `bunx --bun` as the way
        # around it. no leg asserts that here on purpose: hiding the
        # runner's node reliably differs per image and a false red on a tag
        # blocks the release.
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" add -g "@urna/cli@${TAG#v}"
      - name: install (pnpm)
        if: matrix.channel == 'pnpm'
        run: |
          npm install -g pnpm@10
          export PNPM_HOME="$RUNNER_TEMP/pnpm"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          PATH="$PNPM_HOME:$PATH" pnpm add -g "@urna/cli@${TAG#v}"
      - name: install (yarn)
        if: matrix.channel == 'yarn'
        run: |
          npm install -g yarn@1
          yarn global add "@urna/cli@${TAG#v}"
          yarn global bin >> "$GITHUB_PATH"
      - name: install (cargo binstall)
        if: matrix.channel == 'binstall'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y urna --version "${TAG#v}"

      - name: the bare binary reports what is missing
        working-directory: ${{ runner.temp }}
        run: |
          # every channel, homebrew included, installed the tagged version.
          test "$(urna --version)" = "urna ${TAG#v}"
          urna doctor && exit 1 || echo "doctor fails before setup, as it should (exit $?)"
      - name: urna setup completes the install
        working-directory: ${{ runner.temp }}
        run: urna setup --yes --version "$TAG"
      - name: doctor and validate after setup
        working-directory: ${{ runner.temp }}
        run: |
          urna doctor
          urna validate "$GITHUB_WORKSPACE/rust/format/tests/fixtures/golden_v1_minimal.urna"
      # the released payload carries the model catalog: a model it leaves out
      # is refused with its reason (exit 14), with nothing downloaded.
      - name: the payload carries the model catalog
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          code=0
          out=$(urna setup --yes --no-payload --no-python --model wemm-4b) || code=$?
          echo "$out"
          test "$code" = 14
          grep -q "wemm-4b is not offered: flagged too heavy" <<<"$out"

  wheel:
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0: golden fixture
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install uv
        run: python -m pip install uv
      - name: wait for the exact version on pypi
        shell: bash
        run: python tool/tasks/chanprobe.py wait --channel pypi --version "${TAG#v}" --timeout 900
      - name: pip install urna and validate
        shell: bash
        run: |
          python -m pip install "urna==${TAG#v}"
          python -c "import importlib.metadata as m, sys; v = m.version('urna'); assert v == sys.argv[1], v" "${TAG#v}"
          python -c "import urna; assert urna.potion_model_path(), 'potion table must be bundled'"
          python -c "import urna; urna.open('rust/format/tests/fixtures/golden_v1_minimal.urna').validate(); print('validate ok')"
          urna validate rust/format/tests/fixtures/golden_v1_minimal.urna
      - name: uvx entry point
        shell: bash
        run: uvx --from "urna==${TAG#v}" urna validate rust/format/tests/fixtures/golden_v1_minimal.urna
