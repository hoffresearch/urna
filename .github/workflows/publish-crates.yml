# publish the library crates and the cli to crates.io. a reusable workflow:
# cargo-dist calls it as a custom publish job (`publish-jobs` in
# Cargo.toml) after the github release is up, so a tag that fails the
# signature check or the build never reaches crates.io.
#
# order matters (each crate depends on the one before it): urna-format,
# urna-runtime, urna-cli. urna-python and forge-core are `publish = false`.
# a crate whose version is already on crates.io is skipped, so re-running a
# half-finished release picks up where it stopped instead of failing.
#
# prerequisite (one-time): the CARGO_REGISTRY_TOKEN repo secret; see the
# maintainer checklist in docs/usage.md.

name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish crates to crates.io
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          UA: "urna-release (github.com/hoffresearch/urna)"
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "urna-cli") | .version')
          for crate in urna-format urna-runtime urna-cli; do
            if curl -sfA "$UA" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already on crates.io, skipping"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
