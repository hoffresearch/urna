# static checks of the workflows themselves, on every pull request and on a
# push to main that changes .github/workflows or .github/zizmor.yml. nothing
# here runs a job: both tools read the yaml. a pull request runs both jobs
# whatever it changes, because the ruleset requires them: a required check
# whose workflow a path filter skipped would wait forever and block the merge.
#
# actionlint checks syntax, `${{ }}` expressions, `needs`, runner labels
# and, through shellcheck, every `run:` script. it gates the pull request.
# shellcheck reports warnings and errors only (info and style stay quiet).
# one finding is ignored by name: release.yml reads
# `steps.cargo-cyclonedx.output.paths` where the step has `outputs`, so the
# sbom path comes out empty; that line is cargo-dist's template, regenerated
# by `distpatch.py generate` and copied into rehearsal.yml, and both files are never
# hand-edited, so the fix belongs upstream.
#
# zizmor audits the workflows for security: template injection, permissions
# wider than needed, credentials persisted by checkout, unpinned actions,
# dangerous triggers. the findings kept on purpose are in .github/zizmor.yml,
# each with its reason; any other finding fails the pull request, with an
# annotation on its line. a fork's pull request is audited the same way, since
# nothing is uploaded there. on main, zizmor uploads sarif to code scanning
# instead, which closes the alerts a merge fixed.

name: lintworks

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/zizmor.yml"]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: install actionlint (pinned release, checksum verified)
        run: |
          set -eu
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        env:
          SHELLCHECK_OPTS: -S warning
        run: |
          "$RUNNER_TEMP/actionlint" -color \
            -ignore 'property "output" is not defined in object type'

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          # a pull request fails on a finding; main reports to code scanning.
          advanced-security: ${{ github.event_name != 'pull_request' }}
          annotations: ${{ github.event_name == 'pull_request' }}
