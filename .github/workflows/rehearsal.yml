# GENERATED by tool/tasks/rehearsal.py from release.yml; do not edit.
# the release's build jobs on a pull request or a push to main, publishing
# nothing: `python tool/tasks/rehearsal.py generate` after `distpatch.py generate`.
name: Release rehearsal
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    name: does this change touch what the release builds
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.impact.outputs.run }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: impact
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        BEFORE: ${{ github.event.before }}
      run: |
        case "$EVENT" in
          workflow_dispatch) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
          pull_request) python3 tool/tasks/rehearsal.py impact \
            --base "$PR_BASE" --head "$PR_HEAD" ;;
          *) python3 tool/tasks/rehearsal.py impact \
            --base "$BEFORE" --head "$GITHUB_SHA" ;;
        esac
  plan:
    needs:
    - impact
    if: needs.impact.outputs.run == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag-flag: ${{ steps.version.outputs.tag-flag }}
      publishing: 'false'
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        submodules: recursive
    - name: Install dist
      shell: bash
      run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
    - name: Cache dist
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cargo-dist-cache
        path: ~/.cargo/bin/dist
    - id: version
      name: the version a tag would carry
      run: echo "tag-flag=--tag=v$(python3 -c 'import sys; sys.path.insert(0, "tool/tasks"); import embedpack as s; print(s.workspace_version())')" >> "$GITHUB_OUTPUT"
    - id: plan
      run: |
        dist plan ${{ steps.version.outputs.tag-flag }} --output-format=json > plan-dist-manifest.json
        echo "dist ran successfully"
        cat plan-dist-manifest.json
        echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
    - name: Upload dist-manifest.json
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifacts-plan-dist-manifest
        path: plan-dist-manifest.json
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
    - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      contents: read
    steps:
    - name: enable windows longpaths
      run: |
        git config --global core.longpaths true
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        submodules: recursive
    - name: Install Rust non-interactively if not already installed
      if: ${{ matrix.container }}
      run: |
        if ! command -v cargo > /dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        fi
    - name: fetch the potion table (embedder payload), verified against its lfs pointer
      run: sh tool/tasks/getpotion.sh
      shell: bash
    - name: Install dist
      run: ${{ matrix.install_dist.run }}
    - name: Fetch local artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: artifacts-*
        path: target/distrib/
        merge-multiple: true
    - name: Install cargo-auditable
      run: ${{ matrix.install_cargo_auditable.run }}
    - name: Install dependencies
      run: |
        ${{ matrix.packages_install }}
    - name: Build artifacts
      run: |
        # Actually do builds and make zips and whatnot
        dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
        echo "dist ran successfully"
    - id: cargo-dist
      name: Post-build
      shell: bash
      run: |
        # Parse out what we just built and upload it to scratch storage
        echo "paths<<EOF" >> "$GITHUB_OUTPUT"
        dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        cp dist-manifest.json "$BUILD_MANIFEST_NAME"
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifacts-build-local-${{ join(matrix.targets, '_') }}
        path: |
          ${{ steps.cargo-dist.outputs.paths }}
          ${{ env.BUILD_MANIFEST_NAME }}
  custom-wheelmake:
    needs:
    - plan
    uses: ./.github/workflows/wheelmake.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    permissions:
      contents: read
  build-global-artifacts:
    needs:
    - plan
    - build-local-artifacts
    - custom-wheelmake
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        submodules: recursive
    - name: Install cached dist
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: cargo-dist-cache
        path: ~/.cargo/bin/
    - run: chmod +x ~/.cargo/bin/dist
    - name: Install cargo-cyclonedx
      run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.5/cargo-cyclonedx-installer.sh | sh
      shell: bash
    - name: Fetch local artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: artifacts-*
        path: target/distrib/
        merge-multiple: true
    - id: cargo-dist
      shell: bash
      run: |
        dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
        echo "dist ran successfully"

        # Parse out what we just built and upload it to scratch storage
        echo "paths<<EOF" >> "$GITHUB_OUTPUT"
        jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        cp dist-manifest.json "$BUILD_MANIFEST_NAME"
    - id: cargo-cyclonedx
      shell: bash
      run: |
        # Generate SBOM (.cdx.xml) files.
        cargo cyclonedx -v

        # Move all SBOM (.cdx.xml) files under target/distrib/ since
        # we expect all artifacts to be in that folder.
        find . -name '*.cdx.xml' -exec mv '{}' target/distrib/ ';'

        echo "paths<<EOF" >> "$GITHUB_OUTPUT"
        find . -name '*.cdx.xml' | tee -a "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifacts-build-global
        path: |
          ${{ steps.cargo-dist.outputs.paths }}
          ${{ steps.cargo-cyclonedx.output.paths }}
          ${{ env.BUILD_MANIFEST_NAME }}
  assets:
    name: the artifacts a release would upload
    needs:
    - plan
    - build-global-artifacts
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: artifacts-*
        path: dist
        merge-multiple: true
    - env:
        PLAN: ${{ needs.plan.outputs.val }}
      run: |
        printf '%s' "$PLAN" > plan.json
        python3 tool/tasks/rehearsal.py assets --dir dist --plan plan.json \
          --golden rust/format/tests/fixtures/golden_v1_minimal.urna
  rehearsal:
    name: rehearsal
    needs:
    - impact
    - plan
    - build-local-artifacts
    - custom-wheelmake
    - build-global-artifacts
    - assets
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - env:
        NEEDS: ${{ toJSON(needs) }}
      run: python3 tool/tasks/rehearsal.py verdict
