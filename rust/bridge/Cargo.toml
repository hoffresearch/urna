[package]
name = "urna-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# ships as the `urna` wheel on pypi (built by wheelmake.yml in the release,
# published by pypiindex.yml), never as a crate.
publish = false

[lints]
workspace = true

[lib]
name = "_urna"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
urna-format = { workspace = true }
urna-engine = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
hex = "0.4"

[build-dependencies]
pyo3-build-config = "0.29"
