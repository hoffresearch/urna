[package]
name = "urna"
description = "Offline-first vector database in one file: a .urna container with content-addressable citations, and the urna CLI"
version.workspace = true
edition.workspace = true
# ratatui 0.30 needs 1.88; the format and engine crates keep the
# workspace msrv (1.85), only the binary with the terminal ui moves.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# the binary has no rust api worth a docs.rs page; its docs are the site
documentation = "https://docs.urna.dev"
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "database-implementations"]

[lints]
workspace = true

[[bin]]
name = "urna"
path = "src/main.rs"

# cargo-binstall: `cargo binstall urna` fetches the prebuilt binary from
# the github release instead of compiling (issue #75). names match the
# cargo-dist archive layout; windows ships a .zip, everything else .tar.xz.
[package.metadata.binstall]
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# channel names: npm `@urna/cli` (under the workspace `npm-scope`) and the
# homebrew formula `urna` (`brew tap hoffresearch/urna && brew install urna`); the binary
# is `urna` in both.
[package.metadata.dist]
# dist picks up the workspace-root LICENSE for the release archives and the
# npm package; an explicit include would ship it twice.
npm-package = "cli"
formula = "urna"

# `cargo release replace` (tool/tasks/releasepr.sh): the changelog section
# and the versioned fields of CITATION.cff, which cites this crate. each runs
# exactly once; the rest of CITATION.cff, its description included, stays.
# {{date}} is cargo-release's UTC date; the tag check reads the tag's UTC day.
[package.metadata.release]
pre-release-replacements = [
  { file = "../../docs/CHANGELOG", search = "^## \\[Unreleased\\]$", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "../../docs/CHANGELOG", search = "^last-updated: .*$", replace = "last-updated: {{date}}", exactly = 1 },
  { file = "../../CITATION.cff", search = "^version: .*$", replace = "version: \"{{version}}\"", exactly = 1 },
  { file = "../../CITATION.cff", search = "^date-released: .*$", replace = "date-released: \"{{date}}\"", exactly = 1 },
  { file = "../../CITATION.cff", search = "^repository-artifact: https://crates\\.io/crates/urna/.*$", replace = "repository-artifact: https://crates.io/crates/urna/{{version}}", exactly = 1 },
  { file = "../../CITATION.cff", search = "^( +value: https://github\\.com/hoffresearch/urna/releases/tag/v).*$", replace = "${1}{{version}}", exactly = 1 },
  { file = "../../CITATION.cff", search = "^( +description: Release of Urna version ).*$", replace = "${1}{{version}}.", exactly = 1 },
]

[dependencies]
urna-format = { workspace = true }
urna-engine = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memmap2 = { workspace = true }
rand = "0.10"
hex = "0.4"
sha2 = { workspace = true }
# rgb -> xterm-256 for terminals without truecolor (Terminal.app); no deps.
coolor = "1.1"

# the terminal ui: `urna setup` (the interactive installer every channel
# ends in) and `urna tui` (the corpus explorer). on by default so brew, npm,
# crates.io and the tarballs ship the same binary; `cargo install urna
# --no-default-features` builds the engine-only cli without any of it.
# there is no http client here on purpose: `urna setup` downloads through the
# system `curl`, so the binary itself never links a network stack.
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29", optional = true }
tachyonfx = { version = "0.25.2", optional = true }
ratatui-explorer = { version = "0.3", optional = true }
ratatui-cheese = { version = "0.7", optional = true }
hyperrat = { version = "0.1.3", optional = true }
tui-scrollbar = { version = "0.2.8", optional = true }
flate2 = { version = "1.1", optional = true }
tar = { version = "0.4.46", optional = true }

[features]
default = ["tui"]
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:tachyonfx",
    "dep:ratatui-explorer",
    "dep:ratatui-cheese",
    "dep:hyperrat",
    "dep:tui-scrollbar",
    "dep:flate2",
    "dep:tar",
]

[dev-dependencies]
# tests/setup_e2e.rs packs a real payload tarball for `urna setup` to fetch
# from a file:// release.
flate2 = "1.1"
tar = "0.4.46"
