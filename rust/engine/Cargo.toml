[package]
name = "urna-engine"
description = "Memory-mapped search engine of the Urna vector database: SIMD exact search, HNSW, BM25, graph and hybrid search with a mandatory exact rerank"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["database-implementations", "algorithms"]

[dependencies]
urna-format = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"

# mmap/munmap (src/mapping.rs) and posix_madvise (src/mmap_cold.rs); on
# windows mapping.rs declares the three kernel32 calls it needs itself.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[lib]
name = "urna_engine"
path = "src/lib.rs"

# criterion benches: `cargo bench -p urna-engine`.
# default features off: no rayon, no plotters html report, just the
# statistics and the cli.
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "simd"
harness = false

[[bench]]
name = "rerank"
harness = false

[[bench]]
name = "hnsw_build"
harness = false
