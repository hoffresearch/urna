[package]
name = "urna-format"
description = "Frozen v1 binary container of the Urna vector database: layout, manifest, sections, encodings, hashes, reader and writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["database-implementations", "encoding"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
# the encoder and the dictionary trainer (libzstd, C), for writing only; the
# read path decodes zstd with src/encoding/zstd_decoder, in safe Rust.
zstd = { workspace = true, optional = true }
rayon = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }

[features]
default = ["write"]
# write a .urna: the writer, the zstd encoder and the dictionary trainer.
# readers (urna-engine, urna-cbinds, a wasm build) turn it off and link no C.
write = ["dep:zstd"]

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true

[lib]
name = "urna_format"
path = "src/lib.rs"
