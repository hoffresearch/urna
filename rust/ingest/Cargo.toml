# urna-ingest is a SEPARATE cargo workspace. it lives under rust/ but
# the root manifest excludes it from the sovereign workspace, so the
# (eventually heavy, possibly non-deterministic) forge ingestion deps --
# pdf, ocr, clip, fonttools -- never enter urna-format / urna-engine.
# this crate is FORGE-0a: the frozen .fci schema only. build/test it from
# the repo root:
#   cargo build --manifest-path rust/ingest/Cargo.toml
#   cargo test  --manifest-path rust/ingest/Cargo.toml
[package]
name = "urna-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "forge canonical intermediate (.fci) schema, outside the sovereign urna workspace"
repository = "https://github.com/hoffresearch/urna"
# internal ingestion layer, not a crates.io package.
publish = false

[workspace]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# a copy of the root [workspace.lints]: an excluded workspace inherits
# nothing. tool/tests/test_lintmatch.py fails when the two drift.
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
expect_used = "deny"
