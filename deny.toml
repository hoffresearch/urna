# cargo-deny policy (docs/SECURITY.md supply-chain items).
# run: `cargo deny check` (workspace), and with `--manifest-path
# rust/ingest/Cargo.toml` / `fuzz/Cargo.toml` for the two side workspaces.
# gatecheck.yml runs all three on every push and pull request, and on the nightly
# schedule (advisories change without a commit).

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# a yanked crate in the lock is a release blocker, not a warning.
yanked = "deny"
ignore = []

[licenses]
# the set present in the three lockfiles, rechecked on 2026-09-26 when the
# terminal ui (ratatui, tachyonfx) brought the workspace lock to 294 entries
# (it was 128), with rust/ingest and fuzz unchanged; no new license
# entered. every expression below resolves through one of these; `r-efi`
# (MIT OR Apache-2.0 OR LGPL) enters through MIT, `libfuzzer-sys`
# ((MIT OR Apache-2.0) AND NCSA) needs NCSA.
# adding a copyleft-only crate fails the check on purpose.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # a public-domain dedication, not a copyleft: the rule above is about
    # copyleft, so saying it here keeps the rule honest (#608).
    "CC0-1.0",
]
confidence-threshold = 0.8
# the allowlist is shared by three workspaces; a license unused by one of
# them is not a finding.
unused-allowed-license = "allow"

[bans]
# duplicate versions inflate the binary and the audit surface; warn so the
# lock update that fixes them is a visible follow-up, not a blocked pr.
multiple-versions = "warn"
wildcards = "allow"
# syn 2 and syn 3 coexist by upstream choice, not by a stale lock: pyo3-macros
# 0.29 (workspace) and zerocopy-derive 0.8 (through half; workspace and fuzz)
# are still on syn 2 while serde_derive, clap_derive, bytemuck_derive and
# thiserror-impl moved to syn 3. build-time proc-macro input only, nothing of
# it reaches a binary. drop the entry when pyo3 and zerocopy-derive move.
# rust/ingest has no syn 2, so its ci step runs with `-A unmatched-skip`.
skip = [
    { crate = "syn@2", reason = "pyo3-macros 0.29 and zerocopy-derive 0.8 have not moved to syn 3 yet" },
]
# the offline promise, enforced: a query never opens a socket, and no crate
# may bring an http client into the build. the model payload and the sample
# corpus are fetched by `urna setup` through curl, outside the binary.
deny = [
    { crate = "reqwest", reason = "no http client in the build: urna queries offline by construction" },
    { crate = "hyper", reason = "no http client in the build: urna queries offline by construction" },
    { crate = "ureq", reason = "no http client in the build: urna queries offline by construction" },
    { crate = "hf-hub", reason = "no hub client in the build: models arrive through `urna setup`, pinned and hashed" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
