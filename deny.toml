# cargo-deny policy (docs/SECURITY.md supply-chain items).
# run: `cargo deny check` (workspace), and with `--manifest-path
# forge-core/Cargo.toml` / `fuzz/Cargo.toml` for the two side workspaces.
# ci.yml runs all three on every push and pull request, and on the nightly
# schedule (advisories change without a commit).

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# a yanked crate in the lock is a release blocker, not a warning.
yanked = "deny"
ignore = []

[licenses]
# exactly the set present in the three lockfiles on 2026-09-10 (90 packages
# in the workspace, 14 in forge-core, 56 in fuzz). every expression below
# resolves through one of these; `r-efi` (MIT OR Apache-2.0 OR LGPL) enters
# through MIT, `libfuzzer-sys` ((MIT OR Apache-2.0) AND NCSA) needs NCSA.
# adding a copyleft-only crate fails the check on purpose.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# the allowlist is shared by three workspaces; a license unused by one of
# them is not a finding.
unused-allowed-license = "allow"

[bans]
# duplicate versions inflate the binary and the audit surface; warn so the
# lock update that fixes them is a visible follow-up, not a blocked pr.
multiple-versions = "warn"
wildcards = "allow"
# syn 2 and syn 3 coexist by upstream choice, not by a stale lock: pyo3-macros
# 0.29 (workspace) and zerocopy-derive 0.8 (through half; workspace and fuzz)
# are still on syn 2 while serde_derive, clap_derive, bytemuck_derive and
# thiserror-impl moved to syn 3. build-time proc-macro input only, nothing of
# it reaches a binary. drop the entry when pyo3 and zerocopy-derive move.
# forge-core has no syn 2, so its ci step runs with `-A unmatched-skip`.
skip = [
    { crate = "syn@2", reason = "pyo3-macros 0.29 and zerocopy-derive 0.8 have not moved to syn 3 yet" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
