# Python tooling configuration.
#
# The DEV flow does NOT install a Python package — the PyO3 extension is
# built by `cargo build --release -p urna-python` and copied into
# `python/_urna.so`. The Python source under `python/` and `tests/` is
# imported directly by adding `python/` to `sys.path`.
#
# The PUBLISHED package is the `urna` wheel, a maturin project owned by
# `packaging/pyproject.toml` and staged by `scripts/stage_wheel.py` (see
# the reference section of doc/usage.md). This root file stays the dev-tooling config: it exists
# so `ruff` (and any other PEP 518 tool) finds a canonical config at the
# workspace root.
#
# The one exception to "no install path" is the forge SEMANTIC default
# embedder (python/forge/embed_potion.py): it loads a vendored, offline
# model2vec/potion table and needs numpy + tokenizers at runtime (no
# torch, no network). They are declared as a PEP 735 dependency group so
# the requirement is recorded without claiming a publishable package.
# Install with:  uv pip install numpy tokenizers   (or: uv sync --group forge)
# The lexical floor (python/forge/embed_default.py) stays stdlib-only.

[dependency-groups]
forge = [
    "numpy>=1.26",
    "tokenizers>=0.20",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "python/__pycache__",
    "**/_urna.so",
    "**/*.dylib",
    "**/*.dll",
]

[tool.ruff.lint]
# E,F = pycodestyle errors + pyflakes
# W   = pycodestyle warnings
# I   = isort
# B   = flake8-bugbear
# UP  = pyupgrade
# SIM = flake8-simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# `urna` is the package name and is detected by `sys.path.insert`, not by a
# regular install. E402 stays ignored for the path-bootstrap idiom; unused
# imports (F401) are enforced, with intentional re-exports declared via
# __all__ or a targeted noqa.
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
