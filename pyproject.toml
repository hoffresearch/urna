# Python tooling configuration.
#
# The DEV flow does NOT install a Python package: the PyO3 extension is
# built by `cargo build --release -p urna-bridge --features
# pyo3/extension-module` and copied into `rust/bridge/python/urna/_urna.so`
# (the feature keeps libpython out of the cdylib). The `urna` package under
# `rust/bridge/python/` and the scripts under `tool/` import it directly by
# adding `rust/bridge/python/` to `sys.path`.
#
# The PUBLISHED package is the `urna` wheel, a maturin project owned by
# `pkgs/wheel/pyproject.toml` and staged by `tool/tasks/wheelprep.py` (see
# the reference section of docs/USAGE.md). This root file stays the dev-tooling config: it exists
# so `ruff` (and any other PEP 518 tool) finds a canonical config at the
# workspace root.
#
# The one exception to "no install path" is the forge SEMANTIC default
# embedder (urna/embed/potiontab.py): it loads a vendored, offline
# model2vec/potion table and needs numpy + tokenizers at runtime (no
# torch, no network). They are declared as a PEP 735 dependency group so
# the requirement is recorded without claiming a publishable package.
# Install with:  uv pip install numpy tokenizers   (or: uv sync --group forge)
# The lexical floor (urna/embed/lexifloor.py) stays stdlib-only.

[dependency-groups]
forge = [
    "numpy>=1.26",
    "tokenizers>=0.20",
    # image paths (orchestra, visionemb, stbackend) and the forge tests.
    "pillow>=10",
]
# import-graph contracts ([tool.importlinter] below). runs from rust/bridge/python/:
#   cd rust/bridge/python && ../../../.venv/bin/lint-imports --config ../../../pyproject.toml
lint = [
    "import-linter>=2.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "rust/bridge/python/urna/__pycache__",
    "**/_urna.so",
    "**/*.dylib",
    "**/*.dll",
]

[tool.ruff.lint]
# E,F = pycodestyle errors + pyflakes
# W   = pycodestyle warnings
# I   = isort
# B   = flake8-bugbear
# UP  = pyupgrade
# SIM = flake8-simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# `urna` is the package name and is detected by `sys.path.insert`, not by a
# regular install. E402 stays ignored for the path-bootstrap idiom; unused
# imports (F401) are enforced, with intentional re-exports declared via
# __all__ or a targeted noqa.
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
# first-party = the urna package under rust/bridge/python/ (sys.path.insert
# bootstrap), declared so the section split never depends on which dirs exist
# beside pyproject.
known-first-party = ["urna"]

# pyright is installed globally (uv tool install pyright) and used here only as
# an import-resolution check: type checking stays off, an unresolved import is
# an error. extraPaths mirrors the dev sys.path bootstrap (rust/bridge/python/,
# tool/bench/ for the tests, tool/tasks/). demo/ stays out: it imports the
# published wheel. the remaining errors are the optional heavy backends (torch,
# sentence_transformers, open_clip, fitz, the bench competitors) that the dev
# venv does not install, plus _urna until the extension is built into
# rust/bridge/python/urna/_urna.so.
[tool.pyright]
include = ["rust/bridge/python", "tool"]
exclude = ["**/__pycache__", "target", "TMP", "pkgs/stage"]
extraPaths = ["rust/bridge/python", "tool/bench", "tool/tasks"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "off"
reportMissingImports = "error"

# rope is not installed; run it on demand with `uv run --no-project --with rope`.
# source_folders mirrors the dev sys.path so a module move rewrites the imports
# in tool/tests/ and tool/bench/ too.
[tool.rope]
source_folders = ["rust/bridge/python", "tool/bench", "tool/tasks"]
ignored_resources = [
    "*.pyc", "*~", ".ropeproject", ".git", ".venv", "__pycache__",
    "target", "TMP", "docs", "fuzz", "pkgs/stage",
]
save_objectdb = false
save_history = false

# urna is the library, tool/bench the benchmarks on top of it: the benchmarks
# may import urna, urna never imports a benchmark. tool/bench/ is not a
# package, so its modules are top-level names; a new one joins the list.
[tool.importlinter]
root_packages = ["urna"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "urna does not import tool/bench"
type = "forbidden"
source_modules = ["urna"]
forbidden_modules = [
    "baselines", "benchgate", "benchtime", "graphgate", "imageeval", "imagerate", "imagestat",
    "modelrank", "modelview", "presetrun", "recallcmp", "vectorcmp", "vectordbs",
]

[tool.towncrier]
# the changelog's unreleased entries: one file per change in docs/news/, named
# <issue>.<type>.md (+<name>.<type>.md for a change with no issue), so no two
# pull requests edit the same line of docs/CHANGELOG. tool/tasks/releasepr.sh
# runs `towncrier build`, which writes them as the dated section of the
# release below the marker in docs/CHANGELOG and removes them.
directory = "docs/news"
filename = "docs/CHANGELOG"
start_string = "<!-- towncrier: each release lands below this line -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = ""
template = "towncrier:default.md"
wrap = false
all_bullets = true
orphan_prefix = "+"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
